<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>FIELDLOG はじめてガイド</title>
  <script>
    // 旧URL。はじめてガイドは start.html に一本化（体験＝?demo=1、名前は &n=1〜10）
    var n = new URLSearchParams(location.search).get("n");
    location.replace("./start.html?demo=1" + (n ? "&n=" + encodeURIComponent(n) : ""));
  </script>
</head>
<body><p style="font-family:sans-serif;padding:24px"><a href="./start.html?demo=1">はじめてガイドを開く</a></p></body>
</html>
