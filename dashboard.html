<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ダッシュボード</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="stylesheet" href="./fla-tokens.css?v=2026-07-12" />
  <style>
    /* 設計: docs/PHASE2_DASHBOARD_DESIGN_DRAFT.md v0.4 §9〜§11
       見た目: docs/mockups/dashboard_c_detail_2026-08-23.html（案C v0.6）
       用語   : docs/UI_TERMINOLOGY.md（今期の売上／これから請求する分／要対応 …） */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-text-size-adjust:100%;}
    header{background:var(--acc);color:#fff;padding:11px 13px;padding-top:calc(11px + env(safe-area-inset-top));position:sticky;top:0;z-index:100;}
    header .top{display:flex;align-items:center;gap:8px;}
    header h1{font-size:16px;flex:1;}
    header .hbtn{background:rgba(255,255,255,.22);border:none;color:#fff;padding:5px 10px;border-radius:var(--r-sm);font-size:12px;font-family:inherit;cursor:pointer;}
    .ybar{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap;}
    .ybar select{font-family:inherit;font-size:12.5px;padding:3px 7px;border-radius:var(--r-sm);border:none;background:rgba(255,255,255,.22);color:#fff;}
    .ybar select option{color:var(--ink);}
    .ynote{font-size:11px;opacity:.85;}

    #loading{display:flex;justify-content:center;align-items:center;height:60vh;font-size:15px;color:var(--sub);}
    #loading.hidden{display:none;}
    .screen{display:none;padding:10px 10px calc(26px + env(safe-area-inset-bottom));}
    .screen.on{display:block;}

    .c{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
    .c-t{font-size:11.5px;color:var(--sub);display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;gap:8px;}
    .c-t b{color:var(--ink);font-size:12.5px;}
    .c-t .lnk{color:var(--acc);font-weight:bold;cursor:pointer;white-space:nowrap;}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
    .tile{background:var(--bg);border-radius:var(--r-sm);padding:9px 10px;cursor:pointer;}
    .tile .k{font-size:10.5px;color:var(--sub);}
    .tile .v{font-size:16px;font-weight:bold;margin-top:2px;letter-spacing:-.3px;}
    .tile .n{font-size:10px;color:var(--sub);margin-top:1px;line-height:1.4;}
    .tile.in .v{color:var(--ok-ink);}
    .tile.mut .v,.tile.mut .n{color:#b3b1a8;}
    .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;gap:8px;}
    .kv .l{color:var(--sub);} .kv .r{font-weight:bold;white-space:nowrap;}
    .bar{height:8px;background:#eceae2;border-radius:999px;overflow:hidden;display:flex;margin:5px 0 3px;}
    .bar i{display:block;height:100%;}
    .b-done{background:var(--acc);} .b-rest{background:#a8d8c4;} .b-plan{background:#dfdccf;}
    .lg{font-size:10.5px;color:var(--sub);display:flex;gap:9px;flex-wrap:wrap;}
    .lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:middle;}
    .row{display:flex;align-items:center;gap:7px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
    .row:last-child{border-bottom:none;}
    .row .nm{flex:1;min-width:0;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .row .mt{color:var(--sub);font-size:11px;white-space:nowrap;}
    .row .am{font-weight:bold;white-space:nowrap;}
    .pill{font-size:10px;padding:2px 7px;border-radius:999px;white-space:nowrap;flex-shrink:0;}
    .p-warn{background:#fdecea;color:var(--warn);}
    .p-ok{background:var(--ok-bg);color:var(--ok-ink);}
    .p-cau{background:#fdf4e0;color:#a8781a;}
    .p-mut{background:#efeee7;color:var(--sub);}
    .tabs{display:flex;gap:5px;margin-bottom:9px;}
    .tab{flex:1;text-align:center;font-size:12px;padding:7px 0;border-radius:var(--r-sm);background:#fff;border:1px solid var(--line);color:var(--sub);cursor:pointer;}
    .tab.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:bold;}
    .chart{display:flex;align-items:flex-end;gap:10px;height:98px;padding-top:6px;}
    .chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;}
    .chart .stack{width:100%;display:flex;flex-direction:column;justify-content:flex-end;height:100%;}
    .chart .in{background:var(--acc);border-radius:3px 3px 0 0;min-height:1px;}
    .chart .out{background:#e3b5ae;border-radius:0 0 3px 3px;min-height:1px;}
    .chart .lab{font-size:10px;color:var(--sub);margin-top:4px;}
    .chart .amt{font-size:10px;font-weight:bold;}
    /* 請求書発行済み（入金待ち）のカード */
    .argrp{cursor:pointer;}
    .argrp .big{font-size:16px;font-weight:bold;letter-spacing:-.3px;}
    .hint{font-size:10px;color:var(--sub);margin-top:4px;line-height:1.45;}
    .b-ov{background:#e07a6a;} .b-tm{background:var(--acc);} .b-lt{background:#c9c6ba;} .b-nd{background:#efe6c8;}
    /* 売上と支払の折れ線 */
    .lchart{width:100%;height:auto;display:block;margin-top:2px;}
    .note{background:var(--info-bg);color:var(--info-ink);border-radius:var(--r-sm);padding:8px 10px;font-size:11.5px;line-height:1.55;}
    .setup{background:var(--bg);border:1px dashed #cfcdc2;border-radius:var(--r-sm);padding:9px 10px;font-size:11.5px;color:var(--sub);}
    .setup b{color:var(--ink);display:block;margin-bottom:2px;font-size:12.5px;}
    .btn{display:inline-block;background:var(--acc);color:#fff;font-size:12px;padding:7px 13px;border-radius:var(--r-sm);margin-top:7px;font-weight:bold;border:none;font-family:inherit;cursor:pointer;}
    .btn.g{background:#fff;color:var(--acc);border:1px solid var(--acc);}
    .btn.w{background:#fff;color:var(--warn);border:1px solid #f0c8c2;}
    .btn:active{opacity:.7;}
    .sec{font-size:11.5px;color:var(--sub);margin:12px 2px 6px;font-weight:bold;}
    .empty{padding:22px 14px;text-align:center;color:var(--sub);font-size:13px;line-height:1.7;}
    .sbody{display:none;border-top:1px solid var(--line);margin-top:8px;padding-top:8px;}
    .site.open .sbody{display:block;}
    .srow{display:flex;align-items:center;gap:7px;cursor:pointer;}
    .site{border-bottom:1px solid var(--line);padding:9px 0;}
    .site:first-child{padding-top:0;}
    .site:last-child{border-bottom:none;padding-bottom:0;}
    .tg{font-size:10px;color:var(--sub);transition:transform .15s;flex-shrink:0;}
    .site.open .srow .tg{transform:rotate(90deg);}
    input[type=text],input[type=number],input[type=month],input[type=date],select.f{
      font-family:inherit;font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--r-sm);width:100%;background:#fff;color:var(--ink);}
    input:focus,select.f:focus{outline:none;border-color:var(--acc);}
    .fl{font-size:11.5px;color:var(--sub);margin:9px 0 3px;}
    .inline{display:flex;gap:6px;align-items:center;}
    .inline input{flex:1;}
    .chips{display:flex;gap:6px;flex-wrap:wrap;}
    .chip{font-size:12px;padding:6px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--sub);cursor:pointer;}
    .chip.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:bold;}
    #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#333;color:#fff;font-size:13px;padding:10px 16px;border-radius:var(--r-sm);opacity:0;transition:opacity .2s;pointer-events:none;z-index:200;max-width:90%;}
    #toast.show{opacity:.94;} #toast.err{background:var(--warn);}
    /* 運営の「見るだけ」（?support=会社ID・お客さんが「全部」を許可している間だけ・2026-11-01） */
    .fla-support-bar{position:static !important;}
    body.support-mode .screen input, body.support-mode .screen select:not(.rf), body.support-mode .screen textarea{pointer-events:none;background:#f4f3ed;}
    body.support-mode [onclick^="togglePaid"]{pointer-events:none;}
    body.support-mode [onclick^="addMonth"], body.support-mode [onclick^="delMonth"], body.support-mode [onclick^="markPaid"],
    body.support-mode [onclick^="newLead"], body.support-mode [onclick^="saveLead"], body.support-mode [onclick^="wonLead"],
    body.support-mode [onclick^="lostLead"], body.support-mode [data-fla-snap]{display:none !important;}
    /* 日報（2026-11-01） */
    .rbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;}
    .rbar select{flex:1;min-width:0;font-family:inherit;font-size:13px;padding:7px 8px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;color:var(--ink);}
    .rday{font-size:12.5px;font-weight:bold;display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;}
    .rday span{font-weight:normal;color:var(--sub);font-size:11.5px;}
    .rrow{display:flex;gap:7px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
    .rrow:last-child{border-bottom:none;}
    .rrow .rm{flex:1;min-width:0;line-height:1.5;}
    .rrow .rs{color:var(--sub);font-size:11px;}
    .rnote{font-size:11.5px;margin-top:3px;line-height:1.5;word-break:break-word;white-space:pre-wrap;}
    .rnote.iss{color:var(--warn);}
    /* まとめて登録（2026-11-09・管理者が日報をまとめて入れる） */
    .bseg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:#e9e7df;padding:4px;border-radius:10px;margin-bottom:9px;}
    .bseg button{border:none;background:transparent;border-radius:var(--r-sm);min-height:44px;font-family:inherit;font-size:13px;color:#5c5b55;cursor:pointer;}
    .bseg button.on{background:#fff;color:var(--ink);font-weight:bold;box-shadow:0 1px 2px rgba(0,0,0,.08);}
    .bseg small{display:block;font-size:10.5px;font-weight:normal;color:var(--sub);}
    .bh{font-size:12.5px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px;}
    .bh span{font-weight:normal;color:var(--sub);font-size:11.5px;}
    .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;}
    .cal .wd{font-size:11px;color:var(--sub);text-align:center;}
    .cal button{height:40px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0;}
    .cal button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:bold;}
    .cal button:disabled{background:var(--bg);border-color:var(--bg);color:#b3b1a8;cursor:default;}
    .cal i{width:5px;height:5px;border-radius:50%;background:transparent;}
    .cal i.dot{background:var(--warn);} .cal button.on i.dot{background:#fff;}
    .calnav{display:flex;align-items:center;gap:6px;}
    .calnav button,.daynav button{width:40px;height:36px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;color:var(--ink);font-size:16px;font-family:inherit;cursor:pointer;}
    .calnav button:disabled,.daynav button:disabled{color:#c9c6ba;cursor:default;}
    .daynav{display:flex;align-items:center;gap:6px;}
    .daynav input{flex:1;text-align:center;font-weight:bold;}
    .seg{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;flex-shrink:0;}
    .seg button{min-width:46px;min-height:38px;border:none;background:#fff;color:var(--sub);font-family:inherit;font-size:12.5px;cursor:pointer;}
    .seg button.on{background:var(--acc);color:#fff;font-weight:bold;}
    .seg button.on.none{background:var(--sub);}
    .brow{padding:8px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;}
    .brow:last-child{border-bottom:none;}
    .brow .top{display:flex;align-items:center;gap:8px;font-size:13px;}
    .brow .top .nm{flex:1;min-width:0;}
    .brow .ctl{display:flex;align-items:center;gap:6px;}
    .brow .ctl select{flex:1;min-width:0;font-size:14px;}
    .mini{font-size:11.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--acc);background:#fff;color:var(--acc);font-family:inherit;cursor:pointer;white-space:nowrap;}
    .addsub{width:100%;margin-top:8px;font-size:12.5px;padding:10px;border-radius:var(--r-sm);border:1px dashed #cfcdc2;background:var(--bg);color:var(--sub);font-family:inherit;cursor:pointer;}
    .subrow{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px 36px;gap:6px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line);}
    .subrow .lbl{font-size:10.5px;color:var(--sub);margin-bottom:2px;}
    .subrow .del{height:38px;border:none;background:none;color:var(--warn);font-size:18px;cursor:pointer;}
    .bfoot{position:sticky;bottom:0;background:var(--bg);padding:8px 0 calc(4px + env(safe-area-inset-bottom));}
    .bsum{font-size:13px;text-align:center;margin-bottom:7px;}
    .bsum b{font-size:16px;}
    .bbig{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;background:var(--acc);color:#fff;border:none;border-radius:var(--r);font-family:inherit;font-size:15px;font-weight:bold;cursor:pointer;}
    .bbig.g{background:#fff;color:var(--acc);border:1px solid var(--acc);margin-top:8px;}
    .bbig:disabled{opacity:.5;cursor:default;}
    .bnote{border-radius:var(--r-sm);padding:9px 11px;font-size:12.5px;line-height:1.55;margin-bottom:9px;}
    .bnote.ok{background:var(--ok-bg);color:#146b4b;}
    .bnote.ng{background:#fdecea;color:#8f2617;}
    .absrow{display:flex;flex-direction:column;gap:6px;padding:6px 0;}
    .absrow .seg button{flex:1;min-height:40px;}
    .absrow .seg button.on{background:#8f2617;}
    .skip{color:#8a887f;text-decoration:line-through;}
  </style>
</head>
<body>

<header>
  <div class="top">
    <span class="hbtn" id="btn-back" style="display:none" onclick="go('home')">‹ 戻る</span>
    <h1 id="h-title">ダッシュボード</h1>
    <span class="hbtn" id="btn-settings" onclick="go('settings')">設定</span>
  </div>
  <div class="ybar" id="ybar">
    <select id="fy-sel" onchange="onFy(this.value)"></select>
    <span class="ynote" id="fy-note"></span>
  </div>
</header>

<div id="loading">読み込み中…</div>

<!-- ── ホーム ─────────────────────────────────────────────── -->
<div class="screen" id="s-home">
  <div class="c" id="tiles"></div>
  <div id="ar-card"></div>
  <div id="todo-card"></div>
  <div class="tabs">
    <div class="tab on" id="tab-money" onclick="setTab('money')">お金</div>
    <div class="tab" id="tab-sites" onclick="setTab('sites')">現場</div>
    <div class="tab" id="tab-primes" onclick="setTab('primes')">元請</div>
    <div class="tab" id="tab-reports" onclick="setTab('reports')">日報</div>
  </div>
  <div id="tabbody"></div>
</div>

<!-- ── 入金予定 ───────────────────────────────────────────── -->
<div class="screen" id="s-payin"><div id="payin-body"></div></div>
<!-- ── 要対応 ─────────────────────────────────────────────── -->
<div class="screen" id="s-todo"><div id="todo-body"></div></div>
<!-- ── 見込み案件 ─────────────────────────────────────────── -->
<div class="screen" id="s-leads"><div id="leads-body"></div></div>
<!-- ── 見込み案件フォーム ─────────────────────────────────── -->
<div class="screen" id="s-leadform"><div id="leadform-body"></div></div>
<!-- ── 設定 ───────────────────────────────────────────────── -->
<div class="screen" id="s-settings"><div id="settings-body"></div></div>
<!-- ── 日報をまとめて登録 ─────────────────────────────────── -->
<div class="screen" id="s-bulk"><div id="bulk-body"></div></div>

<div id="toast"></div>

<script src="./fla-core.js?v=2026-11-01b"></script>
<script src="./fla-support.js?v=2026-11-01"></script>
<script>
// ── 設定 ───────────────────────────────────────────────────────────────
// LIFF ID（2026-08-23 発行・チャネル「FLA現場メモ」／サイズFull／scope: openid+profile）
const LIFF_ID  = "2009694631-JZQ5AgVq";
let BILL_URL = "https://liff.line.me/2009694631-7HvWrIGj";   // 請求LIFF（請求をつくる導線）
const CAT = [["subcontract","外注費"],["material","材料費"],["other","その他"]];
const PROB = { high:["高（ほぼ決まり）",1], mid:["中（五分五分）",.5], low:["低（声かけ段階）",.2] };

// ── 状態 ───────────────────────────────────────────────────────────────
let cu   = null;
let cfg  = { closingDay:null, fyStartMonth:1, lowMarginPct:15, backlogMonths:3, laborCostPerDay:0 };
let db   = { sites:[], contracts:[], invoices:[], a2:{}, plans:[], months:[], leads:[], reports:[], workers:[] };
let calc = [];               // 現場ごとの集計
let sum  = {};               // 会社サマリー
let todos = [];              // 要対応
let fy = null, tab = "money", screen = "home", leadDraft = null, sortMode = "margin";

const rGet   = (p)          => FLA.rest(p);
// 運営の「見るだけ」では書き込みを送らない（DB 側でも読むことしかできない）
const readOnly = () => { toast("運営は見るだけです（変更はできません）", true); return Promise.resolve({ ok: false, status: 403, json: async () => [] }); };
const rPost  = (p, b, pf)   => cu && cu.support ? readOnly() : FLA.rest(p, { method:"POST",  headers:{ "Content-Type":"application/json", "Prefer": pf || "return=representation" }, body: JSON.stringify(b) });
const rPatch = (p, b)       => cu && cu.support ? readOnly() : FLA.rest(p, { method:"PATCH", headers:{ "Content-Type":"application/json", "Prefer":"return=minimal" }, body: JSON.stringify(b) });
const rDel   = (p)          => cu && cu.support ? readOnly() : FLA.rest(p, { method:"DELETE" });
const enc = (s) => encodeURIComponent(s);
const esc = (s) => FLA.esc(s);
const fmt = (n) => "¥" + Number(Math.round(n||0)).toLocaleString("ja-JP");
const man = (n) => { const v = Math.round((n||0)/10000); return (v>=0?"+":"") + v + "万"; };

// ── 初期化 ─────────────────────────────────────────────────────────────
(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const p = await liff.getProfile();
    cu = { lineId: p.userId };
    const supportCid = FLA.supportCompanyId();
    if (supportCid) {
      let d;
      try { d = await FLA.openSupport(supportCid, "all"); } catch (e) { return fail(esc(e.message)); }
      cu = { ...cu, workerId: null, name: "運営（見るだけ）", role: "support", companyId: supportCid, companyName: d.company_name || "", canBill: true, support: true };
      BILL_URL += "?support=" + encodeURIComponent(supportCid);
      await loadAll();
      return;
    }
    await FLA.ensureToken();
    await boot();
  } catch (e) {
    if (e && e.code === "NOT_REGISTERED") {
      document.getElementById("loading").innerHTML = FLA.notRegisteredHtml();
    } else {
      document.getElementById("loading").textContent = "初期化に失敗しました（" + (e?.message ?? e) + "）。もう一度開いてください。";
    }
  }
})();

async function boot() {
  const res = await rGet(`/workers?line_user_id=eq.${enc(cu.lineId)}&select=id,name,role,company_id,can_bill,companies(name)`);
  if (!res.ok) return fail("利用者の取得に失敗しました (HTTP " + res.status + ")");
  const rows = await res.json();
  if (!rows.length) return fail("登録されていません。管理者に連絡してください。");
  const w = rows[0];
  cu = { ...cu, workerId:w.id, name:w.name, role:w.role, companyId:w.company_id,
         companyName:w.companies?.name ?? "", canBill:!!w.can_bill };
  // 請負・請求・支払は RLS が can_bill 必須（形B）。画面側も同じ基準で出し分ける。
  if (!cu.canBill) return fail("この画面は請求を扱う権限のある方（社長・事務担当）のみご覧いただけます。<br>管理者に連絡してください。");
  await loadAll();
}

// ── 読み込み ───────────────────────────────────────────────────────────
async function loadAll() {
  const c = cu.companyId;
  const [gr, sr, cr, ir, lr, pr, mr, ld, rr, wr, cwr] = await Promise.all([
    rGet(`/company_settings?company_id=eq.${c}&select=closing_day,fiscal_year_start_month,low_margin_pct,backlog_alert_months,labor_cost_per_day`),
    rGet(`/sites?company_id=eq.${c}&select=id,name,status,created_at,target_margin_pct,prime_contractor_id,prime_contractors(id,name,closing_day,payment_month_offset,payment_day)&order=name`),
    rGet(`/construction_contracts?company_id=eq.${c}&select=id,site_id,prime_contractor_id,contract_amount,status,title`),
    rGet(`/billing_invoices?company_id=eq.${c}&status=neq.void&select=id,site_id,prime_contractor_id,status,invoice_type,invoice_number,period_start,period_end,subtotal_amount,total_amount,issued_at,paid_on&order=period_end`),
    rGet(`/billing_invoice_lines?company_id=eq.${c}&mode=eq.A2_rate&select=contract_id,amount,billing_invoices!inner(status)&billing_invoices.status=eq.issued`),
    rGet(`/site_payment_plans?company_id=eq.${c}&select=id,site_id,category,planned_amount`),
    rGet(`/site_payment_months?company_id=eq.${c}&select=id,plan_id,month,amount,is_paid&order=month`),
    rGet(`/sales_leads?company_id=eq.${c}&select=id,name,prime_contractor_id,prime_name,amount,probability,start_month,status&order=created_at.desc`),
    rGet(`/report_details?company_id=eq.${c}&is_subcontractor=eq.false&select=site_id,worker_id,duration,report_date`),
    // 運営の見るだけでは古い日給の列は読めない（日給は下の worker_labor_costs から）
    rGet(`/workers?company_id=eq.${c}&select=${cu.support ? "id,name" : "id,name,labor_cost_per_day"}`),
    // 作業員ごとの日給は、管理者・請求権限の人だけが読める別の表（2026-10 worker_labor_costs）
    rGet(`/worker_labor_costs?company_id=eq.${c}&select=worker_id,labor_cost_per_day`),
  ]);
  if (!sr.ok || !cr.ok || !ir.ok) return fail("データの取得に失敗しました。時間をおいて開き直してください。");

  if (gr.ok) {
    const s = (await gr.json())[0] || {};
    cfg = { closingDay: s.closing_day ?? null, fyStartMonth: s.fiscal_year_start_month ?? 1,
            lowMarginPct: s.low_margin_pct ?? 15, backlogMonths: Number(s.backlog_alert_months ?? 3),
            laborCostPerDay: s.labor_cost_per_day ?? 0 };
  }
  db.sites     = await sr.json();
  db.contracts = await cr.json();
  db.invoices  = await ir.json();
  db.a2 = {};
  if (lr.ok) (await lr.json()).forEach(r => { db.a2[r.contract_id] = (db.a2[r.contract_id]||0) + (r.amount||0); });
  db.plans   = pr.ok ? await pr.json() : [];
  db.months  = mr.ok ? await mr.json() : [];
  db.leads   = ld.ok ? await ld.json() : [];
  db.reports = rr.ok ? await rr.json() : [];
  db.workers = wr.ok ? await wr.json() : [];
  // 新しい表が読めたら、そちらの日給を使う（表がまだ無い間は、旧列 workers.labor_cost_per_day のまま）
  if (cwr.ok) {
    const costs = new Map((await cwr.json()).map(x => [x.worker_id, x.labor_cost_per_day]));
    db.workers = db.workers.map(w => ({ ...w, labor_cost_per_day: costs.has(w.id) ? costs.get(w.id) : null }));
  }

  buildAll();
  buildYears();
  render();
  document.getElementById("loading").classList.add("hidden");
  go("home");
}

async function reload(msg) { await loadAll(); if (msg) toast(msg); }

// ── 日付ユーティリティ ─────────────────────────────────────────────────
function today()      { const d = new Date(); return iso(d.getFullYear(), d.getMonth(), d.getDate()); }
function iso(y,m,d)   { return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
function lastDay(y,m) { return new Date(y, m+1, 0).getDate(); }
function ymOf(isoStr) { return String(isoStr).slice(0,7); }
function thisYm()     { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function ymPlus(ym,n) { const [y,m] = ym.split("-").map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function ymLabel(ym)  { return +ym.slice(5,7) + "月"; }
function fmtDate(s)   { if (!s) return ""; const [,m,d] = String(s).split("-"); return `${+m}/${+d}`; }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }

// 会計年度（開始月ベース）
function fyOf(isoStr) { if (!isoStr) return null; const y=+String(isoStr).slice(0,4), m=+String(isoStr).slice(5,7); return m >= cfg.fyStartMonth ? y : y-1; }
function fyLabel(y)   { return cfg.fyStartMonth === 1 ? `${y}年` : `${y}年度（${cfg.fyStartMonth}月開始）`; }
function currentFy()  { return fyOf(today()); }
function fyRange(y)   { const s = iso(y, cfg.fyStartMonth-1, 1); const e2 = new Date(y+1, cfg.fyStartMonth-1, 0); return [s, iso(e2.getFullYear(), e2.getMonth(), e2.getDate())]; }
function inFy(isoStr, y) { if (!isoStr) return false; const [s,e] = fyRange(y); const d = String(isoStr).slice(0,10); return d >= s && d <= e; }

// 入金予定日 ＝ 締め日(period_end)の payment_month_offset ヶ月後の payment_day 日（31=末日）
function dueDateOf(inv) {
  const prime = primeOf(inv);
  if (!prime || prime.payment_month_offset == null || prime.payment_day == null) return null;
  const [y,m,d] = String(inv.period_end).split("-").map(Number);
  const base = new Date(y, m-1+prime.payment_month_offset, 1);
  const by = base.getFullYear(), bm = base.getMonth();
  const day = prime.payment_day >= 31 ? lastDay(by,bm) : Math.min(prime.payment_day, lastDay(by,bm));
  return iso(by, bm, day);
}
function primeOf(inv) {
  const site = db.sites.find(s => s.id === inv.site_id);
  if (site?.prime_contractors) return site.prime_contractors;
  const viaContract = db.sites.map(s => s.prime_contractors).find(p => p && p.id === inv.prime_contractor_id);
  return viaContract || null;
}

// ── 集計 ───────────────────────────────────────────────────────────────
function laborRate(workerId) {
  const w = db.workers.find(x => x.id === workerId);
  return (w && w.labor_cost_per_day != null) ? w.labor_cost_per_day : cfg.laborCostPerDay;
}
function laborOf(filterFn) {
  return db.reports.filter(filterFn).reduce((n,r) => n + laborRate(r.worker_id) * (r.duration === "full" ? 1 : 0.5), 0);
}

function buildAll() {
  const issued = db.invoices.filter(i => i.status === "issued");

  calc = db.sites.map(s => {
    const contracts = db.contracts.filter(x => x.site_id === s.id);
    const contractTotal = contracts.reduce((n,x) => n + (x.contract_amount||0), 0);
    const billedA2 = contracts.reduce((n,x) => n + (db.a2[x.id]||0), 0);
    const sIssued  = issued.filter(i => i.site_id === s.id);
    const invoiceSubtotal = sIssued.reduce((n,i) => n + (i.subtotal_amount||0), 0);
    const hasContract = contracts.length > 0 && contractTotal > 0;
    const billed = hasContract ? billedA2 : invoiceSubtotal;

    const plans = db.plans.filter(p => p.site_id === s.id);
    const planIds = plans.map(p => p.id);
    const months = db.months.filter(m => planIds.includes(m.plan_id));
    const planTotal = plans.reduce((n,p) => n + (p.planned_amount||0), 0);
    const paidTotal = months.filter(m => m.is_paid).reduce((n,m) => n + (m.amount||0), 0);
    const labor = laborOf(r => r.site_id === s.id);

    const costNow = paidTotal + labor;
    const costPlan = planTotal + labor;
    const hasCost = months.length > 0 || labor > 0;
    const marginNow  = (billed > 0 && hasCost) ? (billed - costNow) / billed * 100 : null;
    const marginFinal = (contractTotal > 0 && (planTotal > 0 || labor > 0)) ? (contractTotal - costPlan) / contractTotal * 100 : null;
    const targetPct = s.target_margin_pct != null ? s.target_margin_pct : cfg.lowMarginPct;

    // 未請求判定（billing.html の二重発行ガードと同じ期間の取り方）
    const cd = s.prime_contractors?.closing_day ?? null;
    const { periodStart, periodEnd } = FLA.billingPeriod(cd);
    const inPeriod  = db.invoices.filter(i => i.site_id === s.id && i.period_end === periodEnd);
    const hasIssued = inPeriod.some(i => i.status === "issued");
    const hasDraft  = inPeriod.some(i => i.status === "draft");
    const isActive  = s.status === "active";

    const firstIssued = sIssued.map(i => i.period_end).sort()[0] || null;

    return { site:s, primeName:s.prime_contractors?.name ?? "", primeId:s.prime_contractor_id || "none",
      isActive, contracts, contractTotal, billedA2, invoiceSubtotal, hasContract, billed, sIssued,
      backlog: Math.max(0, contractTotal - billedA2),
      pct: contractTotal ? Math.max(0, Math.min(100, billedA2/contractTotal*100)) : 0,
      plans, months, planTotal, paidTotal, labor, costNow, costPlan, marginNow, marginFinal, targetPct,
      lowMargin: marginNow != null && marginNow < targetPct,
      periodStart, periodEnd,
      unbilled: isActive && !hasIssued && !hasDraft,
      draftOnly: isActive && !hasIssued && hasDraft,
      fy: firstIssued ? fyOf(firstIssued) : fyOf(String(s.created_at).slice(0,10)),
    };
  });

  buildSummary();
  buildTodos();
}

function buildSummary() {
  const y = fy ?? currentFy();
  const issued = db.invoices.filter(i => i.status === "issued");
  const ym = thisYm();

  // 今月 入る／出る
  const dues = issued.map(i => ({ inv:i, due:dueDateOf(i) })).filter(x => x.due);
  const inThis = dues.filter(x => ymOf(x.due) === ym);
  const inMonth = inThis.reduce((n,x) => n + (x.inv.total_amount || x.inv.subtotal_amount || 0), 0);
  const inPaid  = inThis.filter(x => x.inv.paid_on).reduce((n,x) => n + (x.inv.total_amount || x.inv.subtotal_amount || 0), 0);
  const outThis = db.months.filter(m => ymOf(m.month) === ym);
  const outMonth = outThis.reduce((n,m) => n + (m.amount||0), 0);
  const outPaid  = outThis.filter(m => m.is_paid).reduce((n,m) => n + (m.amount||0), 0);

  // 今期
  const salesFY = issued.filter(i => inFy(i.period_end, y)).reduce((n,i) => n + (i.subtotal_amount||0), 0);
  const paidFY  = db.months.filter(m => m.is_paid && inFy(m.month, y)).reduce((n,m) => n + (m.amount||0), 0);
  const laborFY = laborOf(r => inFy(r.report_date, y));
  const grossFY = salesFY - (paidFY + laborFY);
  const backlog = calc.filter(x => x.fy === y || x.isActive).reduce((n,x) => n + x.backlog, 0);
  const openLeads = db.leads.filter(l => l.status === "open");
  const leadTotal = openLeads.reduce((n,l) => n + (l.amount||0), 0);
  const leadWeighted = openLeads.reduce((n,l) => n + (l.amount||0) * (PROB[l.probability]?.[1] ?? .5), 0);

  // 請求書発行済み（入金待ち）＝入金予定の月にかかわらず、発行済みで未入金の請求（税込）。遅延／今月予定／来月以降／予定日未設定
  const amtOf = i => (i.total_amount || i.subtotal_amount || 0);
  const td = today();
  const unpaidAll = issued.filter(i => !i.paid_on);
  const unpaidDue = dues.filter(x => !x.inv.paid_on);
  const bucket = list => ({ amt: list.reduce((n,x) => n + amtOf(x.inv || x), 0), n: list.length });
  const ar = {
    total: unpaidAll.reduce((n,i) => n + amtOf(i), 0), count: unpaidAll.length,
    overdue: bucket(unpaidDue.filter(x => x.due < td)),
    thisM:   bucket(unpaidDue.filter(x => x.due >= td && ymOf(x.due) === ym)),
    later:   bucket(unpaidDue.filter(x => ymOf(x.due) > ym)),
    noDue:   bucket(unpaidAll.filter(i => !dueDateOf(i))),
  };
  // 遅れていた分の回収＝予定月が今月より前で、今月に入金済みにしたもの（「今月 入る」の合計には入らないので別枠で見せる）
  const lateList = dues.filter(x => x.inv.paid_on && ymOf(x.inv.paid_on) === ym && ymOf(x.due) < ym);
  const lateCollected = lateList.reduce((n,x) => n + amtOf(x.inv), 0);
  // 今期の売上のうち入金済み／入金待ち（税抜・締め日基準）
  const salesPaidFY = issued.filter(i => inFy(i.period_end, y) && i.paid_on).reduce((n,i) => n + (i.subtotal_amount||0), 0);

  // 月平均の売上（年度の経過月数で割る）
  const [fs] = fyRange(y);
  const elapsed = Math.max(1, Math.min(12, (new Date(today()).getFullYear()*12 + new Date(today()).getMonth()) - (new Date(fs).getFullYear()*12 + new Date(fs).getMonth()) + 1));
  const avgMonth = salesFY / elapsed;
  const monthsOfWork = avgMonth > 0 ? (backlog + leadTotal) / avgMonth : null;

  // 3ヶ月の見通し
  const chart = [0,1,2].map(k => {
    const m = ymPlus(ym, k);
    const cin  = dues.filter(x => ymOf(x.due) === m).reduce((n,x) => n + (x.inv.total_amount || x.inv.subtotal_amount || 0), 0);
    const cout = db.months.filter(z => ymOf(z.month) === m).reduce((n,z) => n + (z.amount||0), 0);
    return { ym:m, in:cin, out:cout };
  });

  // 売上と支払（月ごと・今期）＝売上は締め月(period_end)・税抜、支払は登録月。年度初月〜（今月 or データのある最後の月）
  const [fs0, fe0] = fyRange(y);
  const fyEndYm = ymOf(fe0);
  const dataYms = issued.filter(i => inFy(i.period_end, y)).map(i => ymOf(i.period_end))
    .concat(db.months.filter(m => inFy(m.month, y)).map(m => ymOf(m.month)));
  let endYm = y === currentFy() ? ym : fyEndYm;
  dataYms.forEach(d => { if (d > endYm) endYm = d; });
  if (endYm > fyEndYm) endYm = fyEndYm;
  const line = [];
  for (let k = 0, m = ymOf(fs0); k < 12 && m <= endYm; k++, m = ymPlus(m, 1)) {
    line.push({ ym:m,
      sales: issued.filter(i => ymOf(i.period_end) === m).reduce((n,i) => n + (i.subtotal_amount||0), 0),
      pay:   db.months.filter(z => ymOf(z.month) === m).reduce((n,z) => n + (z.amount||0), 0) });
  }

  const hasPaySite = db.plans.length > 0 || db.months.length > 0;
  const hasDue = db.sites.some(s => s.prime_contractors && s.prime_contractors.payment_month_offset != null);

  sum = { y, inMonth, inPaid, outMonth, outPaid, salesFY, paidFY, laborFY, grossFY,
          marginFY: salesFY > 0 ? grossFY/salesFY*100 : null, backlog, leadTotal, leadWeighted,
          monthsOfWork, avgMonth, chart, hasDue, hasPaySite, elapsed,
          ar, lateCollected, lateList, salesPaidFY, salesUnpaidFY: salesFY - salesPaidFY, line };
}

function buildTodos() {
  const y = fy ?? currentFy();
  todos = [];
  calc.filter(x => x.unbilled && (x.fy === y || x.isActive)).forEach(x => todos.push({
    kind:"unbilled", label:"請求漏れ", name:x.site.name, sub:`${fmtDate(x.periodStart)}〜${fmtDate(x.periodEnd)}締め分`,
    amount:null, siteId:x.site.id }));
  db.invoices.filter(i => i.status === "issued" && !i.paid_on).forEach(i => {
    const due = dueDateOf(i);
    if (due && due < today()) todos.push({ kind:"overdue", label:"入金遅延", name:(primeOf(i)?.name ?? "元請未設定"),
      sub:`${fmtDate(i.period_end)}締め分・${due.slice(5).replace("-","/")}予定から${daysBetween(due, today())}日`,
      amount:(i.total_amount || i.subtotal_amount || 0), invId:i.id, invNo:i.invoice_number });
  });
  calc.filter(x => x.lowMargin && (x.fy === y || x.isActive)).forEach(x => todos.push({
    kind:"low", label:"低採算", name:x.site.name, sub:`目標 ${x.targetPct}% に対して ${x.marginNow.toFixed(1)}%`,
    amount:null, siteId:x.site.id }));
  if (sum.monthsOfWork != null && sum.monthsOfWork < cfg.backlogMonths) todos.push({
    kind:"backlog", label:"仕事量", name:"受注残＋見込みが少なめ",
    sub:`約 ${sum.monthsOfWork.toFixed(1)}ヶ月分（目安 ${cfg.backlogMonths}ヶ月）`, amount:null });
}

function buildYears() {
  const years = new Set(calc.map(x => x.fy).filter(v => v != null));
  db.invoices.filter(i => i.status === "issued").forEach(i => years.add(fyOf(i.period_end)));
  years.add(currentFy());
  const list = [...years].filter(v => v != null).sort((a,b) => b-a);
  if (fy == null) fy = list.includes(currentFy()) ? currentFy() : list[0];
  document.getElementById("fy-sel").innerHTML = list.map(y => `<option value="${y}"${y===fy?" selected":""}>${esc(fyLabel(y))}</option>`).join("");
  document.getElementById("fy-note").textContent = `${cu.companyName}／${new Date().getMonth()+1}月${new Date().getDate()}日`;
}

function onFy(v) { fy = +v; buildSummary(); buildTodos(); render(); }
function setTab(t) { tab = t; ["money","sites","primes","reports"].forEach(k => document.getElementById("tab-"+k).classList.toggle("on", k===t)); renderTab(); }

// ── 画面切替 ───────────────────────────────────────────────────────────
function go(name) {
  screen = name;
  ["home","payin","todo","leads","leadform","settings","bulk"].forEach(k => document.getElementById("s-"+k).classList.toggle("on", k===name));
  const titles = { home:"ダッシュボード", payin:"入金予定", todo:"要対応", leads:"見込み案件", leadform:"見込み案件", settings:"ダッシュボードの設定", bulk:"日報をまとめて登録" };
  document.getElementById("h-title").textContent = titles[name];
  document.getElementById("btn-back").style.display = name === "home" ? "none" : "inline-block";
  document.getElementById("btn-settings").style.display = name === "home" ? "inline-block" : "none";
  document.getElementById("ybar").style.display = name === "home" ? "flex" : "none";
  window.scrollTo(0,0);
  if (name === "payin") renderPayin();
  if (name === "todo") renderTodo();
  if (name === "leads") renderLeads();
  if (name === "settings") renderSettings();
  if (name === "bulk") renderBulk();
}

// ── 描画: ホーム ───────────────────────────────────────────────────────
function render() { renderTiles(); renderTodoCard(); renderTab(); }

    ? `粗利 ${fmt(sum.grossFY)}（${sum.marginFY != null ? sum.marginFY.toFixed(1) : "—"}%）`
    : "粗利は支払の登録後";
  document.getElementById("tiles").innerHTML = `
    <div class="split">
      <div class="tile ${sum.hasDue ? "in" : "mut"}" onclick="go('payin')">
        <div class="k">今月 入る</div>
        <div class="v">${sum.hasDue ? fmt(sum.inMonth) : "—"}</div>
        <div class="n">${sum.hasDue ? "入金済み " + fmt(sum.inPaid) + (sum.lateCollected ? "<br>＋遅れていた分の回収 " + fmt(sum.lateCollected) : "") : "元請の入金サイト 未設定"}</div>
      </div>
      <div class="tile ${sum.hasPaySite ? "" : "mut"}" onclick="setTab('sites')">
        <div class="k">今月 出る</div>
        <div class="v">${sum.hasPaySite ? fmt(sum.outMonth) : "—"}</div>
        <div class="n">${sum.hasPaySite ? "支払済み " + fmt(sum.outPaid) : "支払 未登録"}</div>
      </div>
    </div>
    <div class="split" style="margin-top:7px">
      <div class="tile" onclick="setTab('sites')">
        <div class="k">今期の売上</div><div class="v">${fmt(sum.salesFY)}</div><div class="n">${esc(gross)}</div>
      </div>
      <div class="tile" onclick="go('leads')">
        <div class="k">これから請求する分</div><div class="v">${fmt(sum.backlog)}</div>
        <div class="n">＋見込み ${fmt(sum.leadTotal)}</div>
      </div>
    </div>`;

// 🧾 請求書発行済み（入金待ち）＝発行した請求書が、入金予定の月にかかわらず全部入る箱。
//   これから請求 → 発行 → ここ → 「入金済」で消える、というお金の通り道を見せる（発行済みの請求が1枚もない会社では出さない）
function arLegendHtml() {
  const a = sum.ar;
  const part = (label, b, cls) => b.n ? `<span><i class="${cls}"></i>${label} ${fmt(b.amt)}（${b.n}枚）</span>` : "";
  return `<div class="lg">${part("遅延", a.overdue, "b-ov")}${part("今月予定", a.thisM, "b-tm")}${part("来月以降", a.later, "b-lt")}${part("予定日未設定", a.noDue, "b-nd")}${a.count ? "" : "<span>入金待ちはありません</span>"}</div>`;
}
function arCardHtml() {
  if (!db.invoices.some(i => i.status === "issued")) return "";
  const a = sum.ar;
  const seg = (b, cls) => (a.total && b.amt) ? `<i class="${cls}" style="width:${b.amt / a.total * 100}%"></i>` : "";
  return `<div class="c argrp" onclick="go('payin')">
    <div class="c-t"><b>🧾 請求書発行済み（入金待ち）</b><span>${a.count}枚・税込</span></div>
    <div class="kv"><span class="l">合計</span><span class="r big">${fmt(a.total)}</span></div>
    <div class="bar">${seg(a.overdue, "b-ov")}${seg(a.thisM, "b-tm")}${seg(a.later, "b-lt")}${seg(a.noDue, "b-nd")}</div>
    ${arLegendHtml()}
    <div class="lg" style="display:block;line-height:1.5;margin-top:6px">今期の売上 ${fmt(sum.salesFY)}（税抜）＝ 入金済み ${fmt(sum.salesPaidFY)} ＋ 入金待ち ${fmt(sum.salesUnpaidFY)}</div>
    <div class="hint">発行した請求書は、入金予定の月にかかわらず全部ここに入り、「入金済」にすると消えます。「今月 入る」はこのうち今月予定の分です。</div></div>`;
}

// 売上と支払の折れ線（ライブラリなし・SVG直書き）。rows=[{ym, sales, pay}]
function lineChartSvg(rows) {
  const W = 340, H = 156, L = 20, R = 20, T = 20, B = 24;
  const max = Math.max(1, ...rows.map(r => Math.max(r.sales, r.pay)));
  const n = rows.length;
  const x = i => n > 1 ? L + i * (W - L - R) / (n - 1) : W / 2;
  const y = v => T + (H - T - B) * (1 - v / max);
  const pathOf = key => rows.map((r,i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(r[key]).toFixed(1)).join(" ");
  const manV = v => v ? Math.round(v / 10000) : 0;
  const ym = thisYm();
  let g = "";
  [0, .5, 1].forEach(f => { g += `<line x1="${L}" y1="${y(max*f).toFixed(1)}" x2="${W-R}" y2="${y(max*f).toFixed(1)}" stroke="#e2e0d8" stroke-width="1"/>`; });
  const cur = rows.findIndex(r => r.ym === ym);
  if (cur >= 0) g += `<rect x="${(x(cur) - 14).toFixed(1)}" y="${T}" width="28" height="${H - T - B}" fill="#1d9e75" opacity=".07"/>`;
  const lines = `<path d="${pathOf("pay")}" fill="none" stroke="#e07a6a" stroke-width="2" stroke-linejoin="round"/>` +
                `<path d="${pathOf("sales")}" fill="none" stroke="#1d9e75" stroke-width="2.4" stroke-linejoin="round"/>`;
  const dots = rows.map((r,i) =>
    `<circle cx="${x(i).toFixed(1)}" cy="${y(r.pay).toFixed(1)}" r="3" fill="#e07a6a"/>` +
    `<circle cx="${x(i).toFixed(1)}" cy="${y(r.sales).toFixed(1)}" r="3.4" fill="#1d9e75"/>` +
    (r.sales ? `<text x="${x(i).toFixed(1)}" y="${(y(r.sales) - 6).toFixed(1)}" font-size="9.5" font-weight="bold" fill="#178a66" text-anchor="middle">${manV(r.sales)}</text>` : "") +
    (r.pay ? `<text x="${x(i).toFixed(1)}" y="${(y(r.pay) + 12).toFixed(1)}" font-size="9.5" fill="#b8503f" text-anchor="middle">${manV(r.pay)}</text>` : "") +
    `<text x="${x(i).toFixed(1)}" y="${H - 6}" font-size="10" fill="${i === cur ? "#178a66" : "#6b6a63"}" font-weight="${i === cur ? "bold" : "normal"}" text-anchor="middle">${ymLabel(r.ym)}</text>`
  ).join("");
  return `<svg class="lchart" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="売上と支払の月別推移">${g}${lines}${dots}</svg>`;
}

// ── 日報（2026-11-01・社長と、許可があるときの運営の見るだけで同じ画面）────────
// LINE で送られた日報を月ごと・現場ごとに見る。直すのは LINE の「日報修正」から（この画面は見るだけ）。
const rpt = { ym: thisYm(), site: "", cache: {} };
const WD = ["日","月","火","水","木","金","土"];
function reportsHtml() {
  const months = [];
  const d = new Date(); d.setDate(1);
  for (let i = 0; i < 13; i++) { months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`); d.setMonth(d.getMonth()-1); }
  if (!months.includes(rpt.ym)) rpt.ym = months[0];
  // 運営の「見るだけ」には出さない（EF 側でも can_bill の本人以外は弾く）

    <div class="hint" style="margin:0 2px 9px">LINEで報告できなかった分を、まとめて入力できます</div>`;
  return `${bulkBtn}<div class="rbar">
      <select class="rf" onchange="rpt.ym=this.value;loadReports()">${months.map(m => `<option value="${m}" ${m===rpt.ym?"selected":""}>${Number(m.slice(0,4))}年${Number(m.slice(5))}月</option>`).join("")}</select>
      <select class="rf" onchange="rpt.site=this.value;drawReports()"><option value="">すべての現場</option>${db.sites.map(x => `<option value="${esc(x.id)}" ${x.id===rpt.site?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
    </div>
    <div id="rpt-body"><div class="c empty">読み込み中…</div></div>`;
}
// 1ヶ月分の日報と休みを読む（日報タブと「まとめて登録」のカレンダーで共用）。失敗時は false
async function fetchMonth(ym) {
  if (rpt.cache[ym]) return true;
  const c = cu.companyId, from = ym + "-01", to = ym + "-" + String(lastDay(Number(ym.slice(0,4)), Number(ym.slice(5))-1)).padStart(2,"0");
  const [rr, ar] = await Promise.all([
    rGet(`/report_details?company_id=eq.${c}&report_date=gte.${from}&report_date=lte.${to}&select=id,report_date,site_id,worker_id,duration,work_description,issue_text,handover_text,is_subcontractor,subcontractor_name,subcontractor_worker_name,reported_by&order=report_date.desc,created_at.asc`),
    rGet(`/daily_absences?company_id=eq.${c}&absence_date=gte.${from}&absence_date=lte.${to}&select=absence_date,worker_id`),
  ]);
  if (!rr.ok) return false;
  rpt.cache[ym] = { reports: await rr.json(), absences: ar.ok ? await ar.json() : [] };
  return true;
}
async function loadReports() {
  const ym = rpt.ym;
  if (!(await fetchMonth(ym))) { const b = document.getElementById("rpt-body"); if (b) b.innerHTML = '<div class="c empty">日報を読み込めませんでした。開き直してください。</div>'; return; }
  if (ym === rpt.ym) drawReports();
}
function drawReports() {
  const body = document.getElementById("rpt-body");
  const data = rpt.cache[rpt.ym];
  if (!body || !data) return;
  const wName = new Map(db.workers.map(w => [w.id, w.name]));
  const sName = new Map(db.sites.map(x => [x.id, x.name]));
  const nm = (id) => wName.get(id) || "（登録にない人）";
  const rows = data.reports.filter(r => !rpt.site || r.site_id === rpt.site);
  const abs = rpt.site ? [] : data.absences;
  const dayVal = (r) => r.duration === "full" ? 1 : 0.5;
  const own = rows.filter(r => !r.is_subcontractor), sub = rows.filter(r => r.is_subcontractor);
  const n1 = (v) => (Math.round(v*10)/10).toString();
  const issues = own.filter(r => r.issue_text).length;
  const dates = [...new Set([...rows.map(r => r.report_date), ...abs.map(a => a.absence_date)])].sort().reverse();
  const head = `<div class="c"><div class="split">
      <div class="tile" style="cursor:default"><div class="k">自社</div><div class="v">${n1(own.reduce((a,r)=>a+dayVal(r),0))}人工</div><div class="n">${dates.length}日分の日報</div></div>
      <div class="tile" style="cursor:default"><div class="k">下請け</div><div class="v">${n1(sub.reduce((a,r)=>a+dayVal(r),0))}人工</div><div class="n">${issues ? `困りごと ${issues}件` : "困りごとなし"}${abs.length ? `・休み ${abs.length}件` : ""}</div></div>
    </div><div class="hint">LINE で送られた日報と、この画面の「まとめて登録」で入れた日報（「管理者入力」の印）です。直すときは LINE のメニュー「日報修正」からできます。</div></div>`;
  if (!dates.length) { body.innerHTML = head + '<div class="c empty">この月の日報はまだありません。</div>'; return; }
  body.innerHTML = head + dates.map(dt => {
    const dObj = new Date(dt + "T00:00:00");
    const dayOwn = own.filter(r => r.report_date === dt).sort((a,b) => nm(a.worker_id).localeCompare(nm(b.worker_id), "ja"));
    const daySub = sub.filter(r => r.report_date === dt);
    const dayAbs = abs.filter(a => a.absence_date === dt);
    const total = [...dayOwn, ...daySub].reduce((a,r)=>a+dayVal(r),0);
    const ownHtml = dayOwn.map(r => `<div class="rrow"><div class="rm"><b>${esc(nm(r.worker_id))}</b>　<span class="rs">${esc(sName.get(r.site_id) || "")}</span>
        ${r.work_description ? `<div class="rnote">半日：${esc(r.work_description)}</div>` : ""}
        ${r.issue_text ? `<div class="rnote iss">⚠ 困りごと：${esc(r.issue_text)}</div>` : ""}
        ${r.handover_text ? `<div class="rnote">📝 引き継ぎ：${esc(r.handover_text)}</div>` : ""}</div>
        ${r.reported_by && r.reported_by !== r.worker_id ? `<span class="pill p-mut">管理者入力</span>` : ""}
        <span class="pill ${r.duration === "full" ? "p-ok" : "p-cau"}">${r.duration === "full" ? "終日" : "半日"}</span></div>`).join("");
    // 下請けは 現場×会社 でまとめる（名前があれば名前、無ければ人工）
    const groups = new Map();
    daySub.forEach(r => { const k = r.site_id + "|" + (r.subcontractor_name || ""); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
    const subHtml = [...groups.values()].map(g => {
      const named = g.filter(r => r.subcontractor_worker_name).map(r => r.subcontractor_worker_name + (r.duration === "full" ? "" : "（半日）"));
      const unnamed = g.filter(r => !r.subcontractor_worker_name);
      const parts = [...named]; if (unnamed.length) parts.push(`名前なし ${n1(unnamed.reduce((a,r)=>a+dayVal(r),0))}人工`);
      return `<div class="rrow"><div class="rm"><b>下請け ${esc(g[0].subcontractor_name || "（会社名なし）")}</b>　<span class="rs">${esc(sName.get(g[0].site_id) || "")}</span>
        <div class="rnote">${esc(parts.join("・"))}</div><div class="rs">送った人：${esc(nm(g[0].worker_id))}</div></div>
        <span class="pill p-mut">${n1(g.reduce((a,r)=>a+dayVal(r),0))}人工</span></div>`;
    }).join("");
    const absHtml = dayAbs.length ? `<div class="rrow"><div class="rm"><span class="rs">休み：</span>${esc(dayAbs.map(a => nm(a.worker_id)).join("・"))}</div></div>` : "";
    return `<div class="c"><div class="rday">${dObj.getMonth()+1}/${dObj.getDate()}（${WD[dObj.getDay()]}）<span>${n1(total)}人工</span></div>${ownHtml}${subHtml}${absHtml}</div>`;
  }).join("");
}

// ── 日報をまとめて登録（2026-11-09）─────────────────────────────────
// 管理者（請求権限あり）が LINE で報告できなかった分をまとめて入れる。入力は2通り：
//   現場ごと … 1つの現場 × 複数の日 × 複数の人
//   1日ごと … 1日分を、人ごとに現場を選ぶ
// 保存は EF report-bulk（preview で判定 → 確認画面 → commit）。本人がLINEで登録済みの分は上書きしない。
const BULK_FN = `${FLA.SUPA_URL}/functions/v1/report-bulk`;
let bk = null;

function addDays(s, n) { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return iso(d.getFullYear(), d.getMonth(), d.getDate()); }
function dLabel(s)     { const d = new Date(s + "T00:00:00"); return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`; }
function bulkSites()   { return [...db.sites].sort((a,b) => (a.status === "active" ? 0 : 1) - (b.status === "active" ? 0 : 1)); }
function bulkWorkers() { return [...db.workers].sort((a,b) => String(a.name).localeCompare(String(b.name), "ja")); }
function siteOpts(sel, blank) {
  return (blank ? `<option value="">現場をえらぶ</option>` : "") +
    bulkSites().map(x => `<option value="${esc(x.id)}" ${x.id === sel ? "selected" : ""}>${esc(x.name)}</option>`).join("");
}
function durSeg(cur, onclickFn) {
  return `<div class="seg">${[["full","終日"],["half","半日"],["none","なし"]].map(([v,l]) =>
    `<button type="button" class="${cur === v ? "on" : ""} ${v === "none" ? "none" : ""}" aria-pressed="${cur === v}" onclick="${onclickFn}('${v}')">${l}</button>`).join("")}</div>`;
}

function openBulk() {
  if (cu.support) { readOnly(); return; }
  if (!db.sites.length) { toast("先に現場を登録してください", true); return; }
  bk = { mode: "site", step: "input", busy: false,
         siteId: bulkSites()[0].id, ym: thisYm(), days: new Set(), dur: {},
         day: today(), rows: {}, subs: [], payload: null, preview: null, includeAbsent: new Set(), result: null };
  go("bulk");
}
function bulkMode(m) { bk.mode = m; renderBulk(); }

// その日の状況（日報・休み）。月の読み込みが済んでいなければ null
function dayInfo(day) {
  const m = rpt.cache[day.slice(0,7)];
  if (!m) return null;
  const reported = new Set(m.reports.filter(r => !r.is_subcontractor && r.report_date === day).map(r => r.worker_id));
  const absent = new Set(m.absences.filter(a => a.absence_date === day).map(a => a.worker_id));
  return { reported, absent };
}

// ── 描画 ──
async function renderBulk() {
  const el = document.getElementById("bulk-body");
  if (!bk) { go("home"); return; }
  if (bk.step === "confirm") { el.innerHTML = bulkConfirmHtml(); return; }
  if (bk.step === "done")    { el.innerHTML = bulkDoneHtml(); return; }
  const need = bk.mode === "site" ? bk.ym : bk.day.slice(0,7);
  if (!rpt.cache[need]) {
    el.innerHTML = '<div class="c empty">読み込み中…</div>';
    await fetchMonth(need);   // 読めなくても入力はできる（印が出ないだけ）
    if (!rpt.cache[need]) rpt.cache[need] = { reports: [], absences: [] };
  }
  el.innerHTML = `<div class="bseg" role="tablist" aria-label="入力のしかた">
      <button type="button" class="${bk.mode === "site" ? "on" : ""}" aria-selected="${bk.mode === "site"}" onclick="bulkMode('site')">現場ごと<small>複数の日をまとめて</small></button>
      <button type="button" class="${bk.mode === "day" ? "on" : ""}" aria-selected="${bk.mode === "day"}" onclick="bulkMode('day')">1日ごと<small>人ごとに現場を選ぶ</small></button>
    </div>
    ${bk.mode === "site" ? bulkSiteHtml() : bulkDayHtml()}
    ${bulkSubsHtml()}
    <div class="bfoot"><div class="bsum">${bulkSummary()}</div>
      <button type="button" class="bbig" onclick="bulkPreview()" ${bk.busy ? "disabled" : ""}>${bk.busy ? "確認しています…" : "確認へ進む"}</button></div>`;
}

// 現場ごと
function bulkSiteHtml() {
  const [y, m] = bk.ym.split("-").map(Number);
  const first = new Date(y, m-1, 1).getDay(), n = lastDay(y, m-1), t = today();
  const ws = bulkWorkers();
  const cells = [];
  for (let i = 0; i < first; i++) cells.push("<span></span>");
  for (let d = 1; d <= n; d++) {
    const ds = iso(y, m-1, d), dow = new Date(y, m-1, d).getDay();
    const info = dayInfo(ds);
    // 印：一部の人だけ報告がある日、または平日なのに誰も報告していない日（休みの人は除く）
    let dot = false;
    if (info && ds <= t && ws.length) {
      const missing = ws.filter(w => !info.reported.has(w.id) && !info.absent.has(w.id)).length;
      dot = missing > 0 && (info.reported.size > 0 || (dow >= 1 && dow <= 5));
    }
    const on = bk.days.has(ds);
    cells.push(`<button type="button" class="${on ? "on" : ""}" ${ds > t ? "disabled" : ""} aria-pressed="${on}" aria-label="${m}月${d}日${dot ? "（未報告あり）" : ""}" onclick="bulkToggleDay('${ds}')">${d}<i class="${dot ? "dot" : ""}"></i></button>`);
  }
  const picked = [...bk.days].sort();
  const curYm = thisYm();
  return `<div class="c"><label class="bh" for="bk-site">1. 現場</label>
      <select class="f" id="bk-site" onchange="bk.siteId=this.value">${siteOpts(bk.siteId, false)}</select></div>
    <div class="c"><div class="bh">2. 日付（複数えらべます）
        <div class="calnav"><button type="button" aria-label="前の月" onclick="bulkMonth(-1)">‹</button>
          <span style="font-size:12.5px;white-space:nowrap">${y}年${m}月</span>
          <button type="button" aria-label="次の月" onclick="bulkMonth(1)" ${bk.ym >= curYm ? "disabled" : ""}>›</button></div></div>
      <div class="cal">${WD.map(w => `<span class="wd">${w}</span>`).join("")}${cells.join("")}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--sub)">
        <span><i style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-right:4px;vertical-align:middle"></i>未報告の人がいる日</span>
        <button type="button" class="mini" style="margin-left:auto" onclick="bulkThisWeek()">今週の平日をえらぶ</button></div>
      ${picked.length ? `<div class="hint">えらんだ日：${picked.map(fmtDate).join("・")}　<a href="javascript:void(0)" onclick="bk.days.clear();renderBulk()">クリア</a></div>` : ""}
    </div>
    <div class="c"><div class="bh">3. 作業員 <button type="button" class="mini" onclick="bulkAllFull()">全員 終日</button></div>
      ${ws.length ? ws.map(w => `<div class="brow"><div class="top"><span class="nm">${esc(w.name)}</span>
          ${durSeg(bk.dur[w.id] || "none", `bulkSetDur.bind(null,'${w.id}')`)}</div></div>`).join("")
        : '<div class="empty">作業員が登録されていません</div>'}
    </div>`;
}
function bulkToggleDay(ds) { if (bk.days.has(ds)) bk.days.delete(ds); else bk.days.add(ds); renderBulk(); }
function bulkMonth(n) { const nx = ymPlus(bk.ym, n); if (nx > thisYm()) return; bk.ym = nx; renderBulk(); }
function bulkThisWeek() {
  const t = today(), d = new Date(t + "T00:00:00");
  const mon = addDays(t, -((d.getDay() + 6) % 7));
  for (let i = 0; i < 5; i++) { const ds = addDays(mon, i); if (ds <= t) bk.days.add(ds); }
  bk.ym = thisYm(); renderBulk();
}
function bulkAllFull() { bulkWorkers().forEach(w => bk.dur[w.id] = "full"); renderBulk(); }
function bulkSetDur(wid, v) { bk.dur[wid] = v; renderBulk(); }

// 1日ごと
function bulkDayHtml() {
  const info = dayInfo(bk.day) || { reported: new Set(), absent: new Set() };
  const t = today();
  return `<div class="c"><div class="bh">1. 日付</div>
      <div class="daynav"><button type="button" aria-label="前の日" onclick="bulkDay(-1)">‹</button>
        <input type="date" aria-label="日付" value="${bk.day}" max="${t}" onchange="bulkSetDay(this.value)">
        <button type="button" aria-label="次の日" onclick="bulkDay(1)" ${bk.day >= t ? "disabled" : ""}>›</button></div>
      <button type="button" class="bbig g" style="min-height:42px;font-size:13px" onclick="bulkCopyPrev()">前日（${fmtDate(addDays(bk.day,-1))}）と同じ内容を入れる</button></div>
    <div class="c"><div class="bh">2. 作業員ごとに入力</div>
      ${bulkWorkers().map(w => {
        const done = info.reported.has(w.id), abs = info.absent.has(w.id);
        const r = bk.rows[w.id] || { site: "", dur: "none" };
        return `<div class="brow"><div class="top"><span class="nm"><b>${esc(w.name)}</b></span>
            ${done ? '<span class="pill p-ok">登録済み</span>' : ""}${abs ? '<span class="pill p-warn">休み報告あり</span>' : ""}</div>
          ${done ? '<div class="hint" style="margin:0">すでに日報があります。上書きしません</div>' : `<div class="ctl">
            <select class="f" aria-label="${esc(w.name)}の現場" onchange="bulkRow('${w.id}','site',this.value)">${siteOpts(r.site, true)}</select>
            ${durSeg(r.dur, `bulkRow.bind(null,'${w.id}','dur')`)}</div>`}</div>`;
      }).join("") || '<div class="empty">作業員が登録されていません</div>'}
    </div>`;
}
function bulkSetDay(v) { if (!v || v > today()) return; bk.day = v; bk.rows = {}; renderBulk(); }
function bulkDay(n) { bulkSetDay(addDays(bk.day, n)); }
function bulkRow(wid, k, v) {
  const r = bk.rows[wid] || (bk.rows[wid] = { site: "", dur: "none" });
  r[k] = v;

// ── 送る内容をつくる（エラーなら文字列） ──
function bulkBuild() {
  const entries = [], subcontractors = [];
  if (bk.mode === "site") {
    const days = [...bk.days].sort();
    if (!bk.siteId) return "現場をえらんでください";
    if (!days.length) return "日付をえらんでください";
    days.forEach(d => bulkWorkers().forEach(w => {
      const v = bk.dur[w.id];
      if (v === "full" || v === "half") entries.push({ report_date: d, worker_id: w.id, site_id: bk.siteId, duration: v });
    }));
    for (const s of bk.subs) {
      if (!s.full && !s.half) continue;
      if (!s.name.trim()) return "協力会社の会社名を入れてください";
      days.forEach(d => subcontractors.push({ report_date: d, site_id: bk.siteId, name: s.name.trim(), full_count: s.full, half_count: s.half }));
    }
  } else {
    const info = dayInfo(bk.day) || { reported: new Set() };
    for (const w of bulkWorkers()) {
      const r = bk.rows[w.id];
      if (!r || r.dur === "none" || info.reported.has(w.id)) continue;
      if (!r.site) return `${w.name} の現場をえらんでください`;
      entries.push({ report_date: bk.day, worker_id: w.id, site_id: r.site, duration: r.dur });
    }
    for (const s of bk.subs) {
      if (!s.full && !s.half) continue;
      if (!s.name.trim()) return "協力会社の会社名を入れてください";
      if (!s.site) return `${s.name.trim()} の現場をえらんでください`;
      subcontractors.push({ report_date: bk.day, site_id: s.site, name: s.name.trim(), full_count: s.full, half_count: s.half });
    }
  }
  if (!entries.length && !subcontractors.length) return "登録する人がいません（終日・半日をえらんでください）";
  if (entries.length + subcontractors.reduce((a, s) => a + s.full_count + s.half_count, 0) > 500) return "一度に登録できるのは500件までです。分けて入力してください";
  return { entries, subcontractors };
}
function bulkSummary() {
  const p = bulkBuild();
  if (typeof p === "string") return `<span style="color:var(--sub)">${esc(p)}</span>`;
  const subN = p.subcontractors.reduce((a, s) => a + s.full_count + s.half_count, 0);
  const own = bk.mode === "site"
    ? `${bk.days.size}日 × ${new Set(p.entries.map(e => e.worker_id)).size}人 ＝ <b>${p.entries.length}件</b>`
    : `${fmtDate(bk.day)} の <b>${p.entries.length}件</b>`;
  return own + (subN ? `　＋ 協力会社 ${subN}人分` : "");
}

// ── EF 呼び出し ──
async function bulkCall(mode, body) {
  const token = await FLA.ensureToken();
  const res = await fetch(BULK_FN, {
    method: "POST",
    headers: { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify({ mode, ...body }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    console.error("[report-bulk]", mode, res.status, data);
    const msg = res.status === 403 ? "この操作は請求権限のある方だけができます"
      : res.status === 409 ? "途中で日報が届いたため、登録しませんでした。もう一度確認してください"
      : res.status === 400 ? `入力を確認してください（${data.error || "不正な入力"}）`
      : "登録に失敗しました。時間をおいてもう一度お試しください";
    const e = new Error(msg); e.status = res.status; throw e;
  }
  return data;
}
async function bulkPreview() {
  const p = bulkBuild();
  if (typeof p === "string") { toast(p, true); return; }
  bk.busy = true; renderBulk();
  try {
    bk.preview = await bulkCall("preview", p);
    bk.payload = p;
    bk.includeAbsent = new Set();
    bk.step = "confirm";
  } catch (e) { toast(e.message, true); }
  bk.busy = false; renderBulk(); window.scrollTo(0,0);
}

function bulkAbs(key, on) { if (on) bk.includeAbsent.add(key); else bk.includeAbsent.delete(key); renderBulk(); }

async function bulkCommit() {
  if (bk.busy) return;
  bk.busy = true; renderBulk();
  try {
    bk.result = await bulkCall("commit", { ...bk.payload, include_absent: [...bk.includeAbsent] });
    bk.step = "done";
    // 登録した月の日報を読み直す（日報タブ・人件費の集計に反映）
    [...new Set(bk.payload.entries.map(e => e.report_date.slice(0,7)).concat(bk.payload.subcontractors.map(s => s.report_date.slice(0,7))))].forEach(ym => delete rpt.cache[ym]);
    const rr = await rGet(`/report_details?company_id=eq.${cu.companyId}&is_subcontractor=eq.false&select=site_id,worker_id,duration,report_date`);
    if (rr.ok) { db.reports = await rr.json(); buildAll(); }
  } catch (e) {
    toast(e.message, true);
    if (e.status === 409) {   // 状況が変わった → 判定し直す
      try { bk.preview = await bulkCall("preview", bk.payload); bk.includeAbsent = new Set(); } catch (_e) { bk.step = "input"; }
    }
  }
  bk.busy = false; renderBulk(); window.scrollTo(0,0);
}

        ${paid ? `<div class="lg" style="margin-top:4px">済の合計 ${fmt(paid)}</div>` : ""}` : ""}
    </div>`;
  }).join("");

  const status = r.unbilled ? `<div class="note" style="margin-top:7px">⚠ 直近の締め分（${fmtDate(r.periodStart)}〜${fmtDate(r.periodEnd)}）の請求がまだありません。</div>`
               : r.draftOnly ? `<div class="note" style="margin-top:7px">直近の締め分（${fmtDate(r.periodEnd)}）は作成中のまま未発行です。</div>` : "";

  return `<div class="site" id="${esc(id)}">
    <div class="srow" onclick="tgl('${esc(id)}')">

      ${status}
      <div style="margin-top:8px"><a class="btn g" href="${BILL_URL}" style="text-decoration:none">請求を開く</a></div>
    </div></div>`;
}

function primesHtml() {
  const y = fy ?? currentFy();
  const issued = db.invoices.filter(i => i.status === "issued" && inFy(i.period_end, y));
  const groups = {};
  issued.forEach(i => {
    const p = primeOf(i); const key = p?.id ?? "none";
    (groups[key] = groups[key] || { name: p?.name ?? "元請 未設定", prime:p, sales:0, unpaid:0, overdue:0, sites:new Set() });
    groups[key].sales += (i.subtotal_amount||0);
    if (!i.paid_on) {
      const amt = i.total_amount || i.subtotal_amount || 0;
      groups[key].unpaid += amt;
      const due = dueDateOf(i);
      if (due && due < today()) groups[key].overdue += amt;
    }
    if (i.site_id) groups[key].sites.add(i.site_id);
  });
  const list = Object.values(groups).sort((a,b) => b.sales - a.sales);
  if (!list.length) return `<div class="c"><div class="empty">${esc(fyLabel(y))}に発行した請求がありません。</div></div>`;
  const total = list.reduce((n,g) => n + g.sales, 0) || 1;
  return list.map(g => {
    const share = g.sales / total * 100;
    const p = g.prime;
    const terms = p && p.payment_month_offset != null
      ? `${p.closing_day && p.closing_day < 28 ? p.closing_day + "日締め" : "末日締め"}・${p.payment_month_offset === 0 ? "当月" : p.payment_month_offset + "ヶ月後"}${p.payment_day >= 31 ? "末日" : p.payment_day + "日"}`
      : "入金サイト 未設定";
    return `<div class="c">
      <div class="c-t"><b>${esc(g.name)}</b><span>現場${g.sites.size}件</span></div>
      <div class="kv"><span class="l">今期の売上</span><span class="r">${fmt(g.sales)}（${share.toFixed(0)}%）</span></div>
      <div class="bar"><i class="b-done" style="width:${share}%"></i></div>
      <div class="kv"><span class="l">未入金</span><span class="r" style="${g.overdue?"color:var(--warn)":""}">${fmt(g.unpaid)}${g.overdue?`（うち遅延 ${fmt(g.overdue)}）`:""}</span></div>
      <div class="kv"><span class="l">締め／入金</span><span class="r">${esc(terms)}</span></div>
      ${share >= 60 ? `<div class="note" style="margin-top:6px">1社への偏りが大きめです（${share.toFixed(0)}%）。その元請の支払が止まると資金繰りに直結します。</div>` : ""}
    </div>`;
  }).join("");
}

// ── 描画: 入金予定 ─────────────────────────────────────────────────────
function renderPayin() {
  const all = db.invoices.filter(i => i.status === "issued").map(i => ({ inv:i, due:dueDateOf(i) }));
  const rows = all.filter(x => x.due);
  // 入金サイト未設定などで予定日を計算できない請求＝入金待ちカードには数えるので、ここで「入金済」にできる導線を出す
  const noDue = all.filter(x => !x.due && !x.inv.paid_on).sort((a,b) => a.inv.period_end < b.inv.period_end ? -1 : 1);
  if (!rows.length && !noDue.length) {
    document.getElementById("payin-body").innerHTML = `<div class="c"><div class="setup"><b>入金予定はまだ出せません</b>
      元請ごとに入金サイト（締めの◯ヶ月後の◯日）を設定すると、発行済みの請求から自動で計算します。
      <div><button class="btn" onclick="go('settings')">元請の入金サイトを設定</button></div></div></div>`;
    return;
  }
  const overdue = rows.filter(x => !x.inv.paid_on && x.due < today()).sort((a,b) => a.due < b.due ? -1 : 1);
  const rest = rows.filter(x => !(!x.inv.paid_on && x.due < today())).sort((a,b) => a.due < b.due ? -1 : 1);
  const byMonth = {};
  rest.forEach(x => { (byMonth[ymOf(x.due)] = byMonth[ymOf(x.due)] || []).push(x); });

  const card = (x) => {
    const amt = x.inv.total_amount || x.inv.subtotal_amount || 0;
    const pill = x.inv.paid_on ? '<span class="pill p-ok">入金済</span>'
               : !x.due ? '<span class="pill p-cau">予定日未設定</span>'
               : x.due < today() ? '<span class="pill p-warn">遅延</span>'
               : x.due === today() ? '<span class="pill p-cau">📅 今日予定</span>' : '<span class="pill p-mut">予定</span>';
    return `<div class="row">${pill}<span class="nm">${esc(primeOf(x.inv)?.name ?? "元請未設定")}</span>
      <span class="mt">${x.inv.paid_on ? fmtDate(x.inv.paid_on)+"入金" : (x.due ? fmtDate(x.due) : fmtDate(x.inv.period_end) + "締め")}</span>
      <span class="am">${fmt(amt)}</span>
      ${x.inv.paid_on ? "" : `<button class="btn" style="margin-top:0;padding:5px 9px" onclick="markPaid('${x.inv.id}')">入金済</button>`}</div>`;
  };

  document.getElementById("payin-body").innerHTML = `
    <div class="c"><div class="kv"><span class="l">今月 入る（${+thisYm().slice(5,7)}月予定の合計）</span><span class="r">${fmt(sum.inMonth)}</span></div>
      <div class="kv"><span class="l">請求書発行済み（入金待ち）</span><span class="r">${fmt(sum.ar.total)}（${sum.ar.count}枚）</span></div>
      ${arLegendHtml()}
      ${sum.lateCollected ? `<div class="lg" style="display:block;margin-top:5px">✅ 遅れていた分の回収 ${fmt(sum.lateCollected)}（予定は先月以前・今月入金）は「今月 入る」の合計には入りません</div>` : ""}</div>
    ${overdue.length ? `<div class="sec">遅延 ${overdue.length}件</div><div class="c" style="border:1px solid #f0c8c2">${overdue.map(card).join("")}</div>` : ""}
    ${noDue.length ? `<div class="sec">予定日未設定 ${noDue.length}件</div><div class="c" style="border:1px dashed #cfcdc2">
      <div class="lg" style="display:block;margin-bottom:4px">元請の入金サイトが未設定のため予定日を計算できません。<span class="lnk" onclick="go('settings')">入金サイトを設定する ›</span></div>${noDue.map(card).join("")}</div>` : ""}
    ${Object.keys(byMonth).sort().map(m => `<div class="sec">${m.replace("-","年")}月</div><div class="c">${byMonth[m].map(card).join("")}</div>`).join("")}
    <div class="note">入金予定日は「元請の締め日＋入金サイト」から自動計算しています。実際の入金日がずれても、「入金済」を押した日で記録します。</div>`;
}

// ── 書き込み ───────────────────────────────────────────────────────────
async function saveSetting(col, val) {
  const num = col === "backlog_alert_months" ? Number(val) : parseInt(val, 10);
  if (isNaN(num)) return toast("数字を入れてください", true);
  // 行が無い会社（会社作成直後）でも保存できるように upsert（PATCH だと 0行更新＝204 で「保存しました」になるだけ）
  const r = await rPost(`/company_settings?on_conflict=company_id`, { company_id: cu.companyId, [col]: num }, "resolution=merge-duplicates,return=minimal");
  if (!r.ok) return toast("保存に失敗しました", true);
  await reload("保存しました");
  go("settings");
}
async function savePrime(id, col, val) {
  const v = val === "" ? null : parseInt(val, 10);
  const r = await rPatch(`/prime_contractors?id=eq.${id}&company_id=eq.${cu.companyId}`, { [col]: v });
  if (!r.ok) return toast("保存に失敗しました", true);
  await reload("入金サイトを保存しました");
  go("settings");
}
async function saveTarget(siteId, val) {
  const v = val === "" ? null : parseInt(val, 10);
  if (v !== null && (isNaN(v) || v < 0 || v > 100)) return toast("0〜100で入れてください", true);
  const r = await rPatch(`/sites?id=eq.${siteId}&company_id=eq.${cu.companyId}`, { target_margin_pct: v });
  if (!r.ok) return toast("保存に失敗しました", true);
  await reload("目標の利益率を保存しました");
  openSite(siteId);
}
async function savePlan(siteId, category, val) {
  const amount = parseInt(val || "0", 10);
  if (isNaN(amount) || amount < 0) return toast("金額を確認してください", true);
  const r = await rPost(`/site_payment_plans?on_conflict=company_id,site_id,category`,
    { company_id: cu.companyId, site_id: siteId, category, planned_amount: amount, created_by: cu.workerId },
    "resolution=merge-duplicates,return=minimal");
  if (!r.ok) return toast("支払の保存に失敗しました", true);
  await reload("支払の予定を保存しました");
  openSite(siteId);
}
async function addMonth(planId) {
  const mo = document.getElementById("mo-"+planId).value;
  const am = parseInt(document.getElementById("ma-"+planId).value || "0", 10);
  if (!mo) return toast("月を選んでください", true);
  if (!am || am < 0) return toast("金額を入れてください", true);
  const plan = db.plans.find(p => p.id === planId);
  const r = await rPost(`/site_payment_months?on_conflict=plan_id,month`,
    { company_id: cu.companyId, plan_id: planId, month: mo + "-01", amount: am },
    "resolution=merge-duplicates,return=minimal");
  if (!r.ok) return toast("月別の保存に失敗しました", true);
  await reload("月別の予定を追加しました");
  if (plan) openSite(plan.site_id);
}
async function togglePaid(monthId, to) {
  const m = db.months.find(x => x.id === monthId);
  const r = await rPatch(`/site_payment_months?id=eq.${monthId}&company_id=eq.${cu.companyId}`,
    { is_paid: to === true || to === "true", paid_on: (to === true || to === "true") ? today() : null });
  if (!r.ok) return toast("更新に失敗しました", true);
  await reload("更新しました");
  const plan = db.plans.find(p => p.id === m?.plan_id);
  if (plan) openSite(plan.site_id);
}
async function delMonth(monthId) {
  const m = db.months.find(x => x.id === monthId);
  const plan = db.plans.find(p => p.id === m?.plan_id);
  const r = await rDel(`/site_payment_months?id=eq.${monthId}&company_id=eq.${cu.companyId}`);
  if (!r.ok) return toast("削除に失敗しました", true);
  await reload("削除しました");
  if (plan) openSite(plan.site_id);
}
async function markPaid(invId) {
  const r = await rPatch(`/billing_invoices?id=eq.${invId}&company_id=eq.${cu.companyId}`, { paid_on: today() });
  if (!r.ok) return toast("更新に失敗しました", true);
  const back = screen;
  await reload("入金済みにしました");
  go(back);
}
async function saveLead() {
  syncLeadForm();
  if (!leadDraft.name) return toast("案件名を入れてください", true);
  const amount = parseInt(leadDraft.amount || "0", 10);
  const body = { company_id: cu.companyId, name: leadDraft.name, prime_contractor_id: leadDraft.prime_contractor_id,
    amount: isNaN(amount) ? 0 : amount, probability: leadDraft.probability,
    start_month: leadDraft.start_month ? leadDraft.start_month + "-01" : null, created_by: cu.workerId };
  const r = leadDraft.id
    ? await rPatch(`/sales_leads?id=eq.${leadDraft.id}&company_id=eq.${cu.companyId}`, body)
    : await rPost(`/sales_leads`, body, "return=minimal");
  if (!r.ok) return toast("保存に失敗しました", true);
  await reload("保存しました");
  go("leads");
}
async function lostLead() {
  const r = await rPatch(`/sales_leads?id=eq.${leadDraft.id}&company_id=eq.${cu.companyId}`, { status: "lost" });
  if (!r.ok) return toast("更新に失敗しました", true);
  await reload("見送りにしました");
  go("leads");
}
async function wonLead() {
  syncLeadForm();
  const amount = parseInt(leadDraft.amount || "0", 10) || 0;
  // ① 現場（同名の稼働中現場があれば再利用＝途中で失敗して押し直しても二重に作らない）
  let site = null;
  const er = await rGet(`/sites?company_id=eq.${cu.companyId}&name=eq.${enc(leadDraft.name)}&status=eq.active&select=id&limit=1`);
  if (er.ok) site = (await er.json())[0] || null;
  if (!site) {
    const sr = await rPost(`/sites`, { company_id: cu.companyId, name: leadDraft.name, status: "active",
      prime_contractor_id: leadDraft.prime_contractor_id, created_by: cu.workerId }, "return=representation");
    if (!sr.ok) return toast("現場の登録に失敗しました", true);
    site = (await sr.json())[0];
  }
  // ② 請負金額（元請と金額があるときだけ・同じ現場×元請に既にあれば作らない）
  if (leadDraft.prime_contractor_id && amount > 0) {
    const cx = await rGet(`/construction_contracts?site_id=eq.${site.id}&prime_contractor_id=eq.${leadDraft.prime_contractor_id}&select=id&limit=1`);
    const exists = cx.ok && (await cx.json()).length > 0;
    if (!exists) {
      const cr = await rPost(`/construction_contracts`, { company_id: cu.companyId, site_id: site.id,
        prime_contractor_id: leadDraft.prime_contractor_id, original_amount: amount, title: leadDraft.name }, "return=minimal");
      if (!cr.ok) return toast("現場は作れましたが請負金額の登録に失敗しました。もう一度「受注した」を押してください", true);
    }
  }
  // ③ 案件を受注済みに（失敗したら見込みのまま＝押し直せる）
  const pr = await rPatch(`/sales_leads?id=eq.${leadDraft.id}&company_id=eq.${cu.companyId}`, { status: "won", site_id: site.id });
  if (!pr.ok) return toast("案件の更新に失敗しました。もう一度「受注した」を押してください", true);
  await reload("受注として現場を作りました");
  go("home"); setTab("sites");
}

// ── ユーティリティ ─────────────────────────────────────────────────────
function tgl(id) { const el = document.getElementById(id); if (el) el.classList.toggle("open"); }
function openSite(siteId) { const el = document.getElementById("site-" + siteId); if (el) el.classList.add("open"); }
function fail(html) {
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("s-home").classList.add("on");
  document.getElementById("ybar").style.display = "none";
  document.getElementById("btn-settings").style.display = "none";
  document.getElementById("tiles").innerHTML = `<div class="empty">${html}</div>`;
  document.querySelector(".tabs").style.display = "none";
}
function toast(msg, err) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = err ? "err show" : "show";
  setTimeout(() => t.classList.remove("show"), 3000);
}
</script>
