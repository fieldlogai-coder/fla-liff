<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>FIELDLOG はじめてガイド</title>
  <meta name="description" content="ボタンを押していくだけで、友だち追加・登録・最初の日報まで進めます（約5分）。" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="FIELDLOG" />
  <meta property="og:title" content="FIELDLOG はじめてガイド" />
  <meta property="og:description" content="ボタンを押していくだけで、友だち追加・登録・最初の日報まで進めます（約5分）。" />
  <meta property="og:url" content="https://fieldlogai-coder.github.io/fla-liff/start.html" />
  <meta name="twitter:card" content="summary" />
  <link rel="stylesheet" href="./fla-tokens.css?v=2026-07-20" />
  <style>
    :root{ --acc:var(--acc-daily); --acc-dark:var(--acc-daily-dark); --hl:#ffd54d; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-text-size-adjust:100%;line-height:1.7;}
    button{font-family:inherit;cursor:pointer;}
    header{background:var(--acc);color:#fff;padding:12px 16px 10px;padding-top:calc(12px + env(safe-area-inset-top));position:sticky;top:0;z-index:10;}
    header .row{display:flex;align-items:center;gap:10px;}
    header h1{font-size:15px;flex:1;}
    header .who{font-size:12px;background:rgba(255,255,255,.22);border-radius:999px;padding:2px 10px;white-space:nowrap;}
    .bar{display:flex;gap:4px;margin-top:9px;}
    .bar i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.35);}
    .bar i.done{background:#fff;}
    .bar i.now{background:var(--hl);}
    .wrap{padding:14px 16px 40px;max-width:480px;margin:0 auto;}

    .kicker{font-size:12px;font-weight:700;color:var(--acc-dark);}
    h2{font-size:22px;line-height:1.35;margin:2px 0 6px;text-wrap:balance;}
    .lead{font-size:15px;color:var(--ink);margin-bottom:12px;}
    .card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:12px;}
    .label{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
    .label b{background:var(--ink);color:#fff;border-radius:999px;padding:1px 9px;font-size:11px;}

    /* LINEのまねをした練習画面 */
    .phone{background:#8cabd9;border-radius:16px;padding:10px 10px 0;overflow:hidden;}
    .talk{min-height:120px;padding-bottom:10px;}
    .bub{max-width:86%;border-radius:14px;padding:8px 12px;font-size:14px;line-height:1.6;margin:7px 0;white-space:pre-line;width:fit-content;animation:pop .25s ease-out;}
    .bub.bot{background:#fff;color:#222;border-top-left-radius:4px;}
    .bub.me{background:#8de055;color:#111;margin-left:auto;border-top-right-radius:4px;}
    @keyframes pop{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px;}
    .chip{background:rgba(30,30,30,.78);color:#fff;border:none;border-radius:999px;padding:8px 14px;font-size:13px;}
    .fcard{background:#fff;border-radius:12px;padding:12px;margin:7px 0;animation:pop .25s ease-out;}
    .fcard .t{font-size:12px;color:#6b6a63;margin-bottom:8px;}
    .fchips{display:flex;gap:6px;flex-wrap:wrap;}
    .fchip{flex:1;background:#e9f7ec;color:#00b900;border:none;text-align:center;border-radius:10px;padding:11px 4px;font-size:13px;font-weight:700;white-space:nowrap;}
    .fchip.gray{background:#f0eee6;color:#6b6a63;flex-basis:100%;}
    .inputbar{display:flex;gap:8px;align-items:center;background:#fff;margin:0 -10px;padding:8px 10px;}
    .inputbar .box{flex:1;background:#f1f1f1;border-radius:18px;padding:8px 14px;font-size:15px;min-height:38px;}
    .inputbar .send{background:#06c755;color:#fff;border:none;border-radius:18px;padding:9px 16px;font-size:14px;font-weight:700;}
    .menubar{background:#fff;margin:0 -10px;padding:10px;}
    .menubar .t{font-size:11px;color:#6b6a63;margin-bottom:6px;}
    .addbar{background:#fff;margin:0 -10px;padding:16px 10px;text-align:center;}
    .addbar .nm{font-weight:700;font-size:15px;margin-bottom:10px;}
    .addbar button{background:#06c755;color:#fff;border:none;border-radius:8px;padding:11px 44px;font-size:15px;font-weight:700;}
    .hl{outline:3px solid var(--hl);outline-offset:2px;animation:pulse 1.2s infinite;}
    @keyframes pulse{50%{outline-color:#ff9800;}}
    .dim{opacity:.45;}
    .simdone{background:var(--ok-bg);color:var(--ok-ink);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;font-weight:700;margin-top:10px;}
    .hint{font-size:12px;color:var(--sub);margin-top:8px;text-align:center;}
    .linkbtn{background:none;border:none;color:var(--sub);font-size:12px;text-decoration:underline;padding:6px;}

    .go{display:block;width:100%;background:#06c755;color:#fff;border:none;border-radius:var(--r);padding:16px 12px;font-size:17px;font-weight:700;text-align:center;text-decoration:none;box-shadow:0 2px 0 #049a41;}
    .go small{display:block;font-size:12px;font-weight:400;opacity:.92;margin-top:2px;}
    .go:active{transform:translateY(2px);box-shadow:none;}
    .okline{font-size:13px;color:var(--sub);margin-top:10px;}
    .okline b{color:var(--ink);}

    .done{display:block;width:100%;background:var(--ink);color:#fff;border:none;border-radius:var(--r);padding:15px;font-size:16px;font-weight:700;}
    .done.light{background:var(--card);color:var(--ink);border:1px solid var(--line);}
    .back{display:block;margin:10px auto 0;background:none;border:none;color:var(--sub);font-size:13px;padding:8px 14px;}
    details{background:var(--card);border-radius:var(--r);padding:12px 14px;margin:12px 0;font-size:13px;}
    summary{font-weight:700;cursor:pointer;}
    details li{margin:8px 0 0 18px;}
    .pick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px;}
    .pick button{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 4px;font-size:17px;font-weight:700;color:var(--ink);}
    .pick button.on{border-color:var(--acc);background:var(--info-bg);}
    ul.plain{list-style:none;font-size:14px;}
    ul.plain li{padding:7px 0;border-bottom:1px solid var(--line);}
    ul.plain li:last-child{border:none;}
    .next-links a{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;text-decoration:none;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.06);}
    .next-links .icn{width:42px;height:42px;border-radius:12px;background:var(--info-bg);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
    .next-links .t{font-size:15px;font-weight:700;line-height:1.4;}
    .next-links .d{font-size:12px;color:var(--sub);}
    .field{display:block;width:100%;border:2px solid var(--line);border-radius:var(--r);padding:13px 14px;font-size:17px;font-family:inherit;background:#fff;color:var(--ink);}
    .field:focus{outline:none;border-color:var(--acc);}
    .flabel{font-size:13px;font-weight:700;margin:12px 0 6px;display:block;}
    .out{background:#f1f1f1;border-radius:var(--r-sm);padding:10px 12px;font-size:13px;word-break:break-all;white-space:pre-wrap;margin:8px 0;}
    .copy{background:var(--ink);color:#fff;border:none;border-radius:var(--r-sm);padding:9px 14px;font-size:13px;font-weight:700;}
    .pcnote{display:none;background:#fff8e1;border-radius:var(--r);padding:12px 14px;font-size:13px;margin-bottom:12px;}
    @media (min-width:700px) and (hover:hover){ .pcnote{display:block;} }
    @media (prefers-reduced-motion:reduce){ .hl,.bub,.fcard{animation:none;} }
  </style>
</head>
<body>

<header>
  <div class="row"><h1>FIELDLOG はじめてガイド</h1><span class="who" id="who"></span></div>
  <div class="bar" id="bar"></div>
</header>

<div class="wrap">
  <div class="pcnote">📱 このページは<b>スマホ</b>で開いてください（LINEが入っているスマホ）。ボタンを押すとLINEが開きます。</div>
  <div id="view"></div>
</div>

<script>
/* ===== FIELDLOG はじめてガイド =====
   1つのページで 2つの使い方（URLで切り替わる）:
     体験（デモ建設）: start.html?demo=1&n=1      … n=1〜10 で 一郎〜十郎
     本番（PoC各社）  : start.html?c=合言葉&co=会社名 … リンクは start.html?make で作る
   運営が変えるのは下の「設定」だけ */
const OA_ID   = "@165bmpmn";                       // FIELDLOG公式アカウント
const DEMO    = { code: "デモ", company: "デモ建設株式会社",
                  names: ["一郎", "二郎", "三郎", "四郎", "五郎", "六郎", "七郎", "八郎", "九郎", "十郎"],
                  sites: ["〇〇ビル改修工事", "◇◇マンション大規模修繕"] };
const BASE    = "https://fieldlogai-coder.github.io/fla-liff/start.html";
/* ================================== */

const Q = new URLSearchParams(location.search);
const MAKE = Q.has("make");
const IS_DEMO = Q.has("demo");
const ADD_URL = "https://line.me/R/ti/p/" + OA_ID;
const sayUrl  = (t) => "https://line.me/R/oaMessage/" + OA_ID + "/?" + encodeURIComponent(t);
const KEY = "fla_start_v2_" + (IS_DEMO ? "demo" : "real");
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } },
  set(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} },
};
const saved = store.get();
const qn = parseInt(Q.get("n"), 10);
const fixedName = IS_DEMO && qn >= 1 && qn <= DEMO.names.length ? DEMO.names[qn - 1] : null;
const urlCode = (Q.get("c") || "").trim();

const S = {
  step: saved.step || 0, sim: 0,
  name: fixedName || saved.name || "",
  code: IS_DEMO ? DEMO.code : (urlCode || saved.code || ""),
  company: IS_DEMO ? DEMO.company : ((Q.get("co") || "").trim() || saved.company || ""),
};
// 別の会社のリンクを開き直したら、進み具合は最初から
if (!IS_DEMO && urlCode && saved.code && saved.code !== urlCode) { S.step = 0; S.name = ""; }
const save = () => store.set({ step: S.step, name: S.name, code: S.code, company: S.company });
const full = () => (IS_DEMO ? "デモ " : "") + S.name;
const coName = () => S.company || "（あなたの会社名）";
const SITES = IS_DEMO ? DEMO.sites : ["△△ビル", "〇〇現場"];
const SITE = SITES[1];

const view = document.getElementById("view");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bub = (who, t) => `<div class="bub ${who}">${esc(t)}</div>`;

const menuHtml = (hl) => {
  const b = (l) => `<button class="fchip${l === hl ? " hl" : " dim"}" ${l === hl ? 'data-tap="1"' : ""}>${l}</button>`;
  return `<div class="menubar"><div class="t">▼ トーク画面の下のメニュー</div>
    <div class="fchips">${b("日報報告")}${b("日報確認")}${b("日報修正")}</div>
    <div class="fchips" style="margin-top:6px">${b("現場メモ")}${b("設定")}${b("休み報告")}</div></div>`;
};

/* 1ステップ＝「れんしゅう（ページ内）」→「本番（LINEを開く）」→「できた」 */
function steps() {
  const doneMsg = "登録完了しました。\n所属：" + coName() + "\nお名前：" + full() + "\nお疲れ様でした。";
  return [
    { kicker: "ステップ 1 / 5", title: "友だち追加する",
      lead: "まず下の画面で<b>黄色く光るボタン</b>を押して、れんしゅうしてみましょう。",
      sim: [{ ctl: "add", bot: "友だち追加ありがとうございます！\nまだ登録が完了していません。\n会社から伝えられた「合言葉」をこのトークにそのまま送ると、登録を始められます。" }],
      go: { label: "LINEで友だち追加する", sub: "押すとLINEが開きます →「追加」を押す", url: ADD_URL },
      ok: "<b>「友だち追加ありがとうございます！」</b>と返ってくればOKです。",
      help: ["すでに友だちの場合は「追加」ボタンが出ません。そのまま次へ進んでください。",
             "LINEが開かないときは、LINEアプリの検索で ID「" + OA_ID + "」を探して追加してください。"] },

    { kicker: "ステップ 2 / 5", title: "合言葉「" + S.code + "」を送る",
      lead: "合言葉を送ると、どの会社のメンバーかが決まります。<b>文字は入力済み</b>なので「送信」を押すだけです。",
      sim: [{ ctl: "send", me: S.code, bot: coName() + " ですね。\nお名前を入力してください。" }],
      go: { label: "LINEを開く", sub: "「" + S.code + "」は入力済み → 送信（▶）を押すだけ", url: sayUrl(S.code) },
      ok: "<b>「" + (S.company ? S.company + " ですね。" : "◯◯（会社名）ですね。") + "」</b>と返ってくればOKです。",
      help: ["入力欄が空だったら、「" + S.code + "」と自分で打って送ってください。",
             "ちがう返事が来たら、いちど「キャンセル」と送ってから、もう一度「" + S.code + "」を送ってください。",
             "返事が何も来ないときは、" + (IS_DEMO ? "案内した担当者" : "会社の担当者") + "に連絡してください（そのまま待っていて大丈夫です）。"] },

    IS_DEMO ?
    { kicker: "ステップ 3 / 5", title: "名前「" + S.name + "」を送る",
      lead: "あなたはデモ用の名前 <b>「" + full() + "」</b> として参加します。これも送信を押すだけです。",
      sim: [{ ctl: "send", me: S.name, bot: full() + "さんですか？", chips: ["はい", "違います"] },
            { ctl: "pick", me: "はい", bot: doneMsg }],
      go: { label: "LINEを開く", sub: "「" + S.name + "」は入力済み → 送信 →「はい」を押す", url: sayUrl(S.name) },
      ok: "<b>「登録完了しました。」</b>と返ってくれば、登録は終わりです 🎉",
      help: ["「すでに別のアカウントで登録済みです」と出たら、その名前は他の人が使用中です。担当者に連絡してください。",
             "「登録リストに見つかりませんでした」と出たら、名前の打ちまちがいです。「" + S.name + "」だけを送ってください。",
             "「まだ登録が完了していません」と出たら、ステップ2の合言葉からやり直してください。"] } :
    { kicker: "ステップ 3 / 5", title: "お名前を送る",
      lead: "<b>「" + S.name + "」</b> で送ります。これも送信を押すだけです。",
      sim: [{ ctl: "send", me: S.name, bot: doneMsg }],
      go: { label: "LINEを開く", sub: "「" + S.name + "」は入力済み → 送信（▶）を押すだけ", url: sayUrl(S.name) },
      ok: "<b>「登録完了しました。」</b>と返ってくれば、登録は終わりです 🎉<br>「◯◯さんですか？」と聞かれたら<b>「はい」</b>を押してください。",
      help: ["「登録リストに見つかりませんでした」と出たら、会社に登録されている名前とちがっています。名字だけ・フルネームなど、書き方を変えて送り直すか、会社の担当者に確認してください。",
             "「すでに別のアカウントで登録済みです」「同じ名前の方が複数登録されています」と出たら、会社の担当者に連絡してください。",
             "「まだ登録が完了していません」と出たら、ステップ2の合言葉からやり直してください。",
             "名前を直したいときは、いちばん下の「前のステップに戻る」を3回押すと最初の画面に戻れます。"] },

    { kicker: "ステップ 4 / 5", title: IS_DEMO ? "日報を1件出してみる" : "今日の日報を出す",
      lead: "ここからが毎日の操作です。<b>全部ボタンを押すだけ</b>で、文字は打ちません。まず下でれんしゅう（7タップ）。" +
            (IS_DEMO ? "" : "<br><b>本番は本当の日報として会社に届きます。</b>今日お休みの方・まだ仕事中の方は、れんしゅうだけして、仕事のあとに本番をどうぞ。"),
      sim: [{ ctl: "menu", me: "日報報告", card: { t: "報告の種類を選んでください", chips: ["昨日と同じ", "通常報告", "休み"] } },
            { ctl: "pick", me: "通常報告", card: { t: "現場を選んでください", chips: SITES } },
            { ctl: "pick", me: SITE, bot: SITE + " の勤務区分を選んでください", chips: ["終日", "半日"] },
            { ctl: "pick", me: "終日", bot: "異常はありましたか？", chips: ["異常なし", "異常あり"] },
            { ctl: "pick", me: "異常なし", bot: "引き継ぎ事項はありますか？", chips: ["なし", "あり"] },
            { ctl: "pick", me: "なし", bot: "「" + SITE + "」を追加しました。\n別の現場はありますか？", chips: ["完了", "別の現場を追加"] },
            { ctl: "pick", me: "完了", bot: "✅ 本日の報告を登録しました。\nお疲れ様でした！" }],
      go: { label: "LINEを開いて本番", sub: "下のメニュー「日報報告」から、同じ順に押す", url: ADD_URL },
      ok: "<b>「お疲れ様でした！」</b>まで行けば完了です。" + (IS_DEMO ? "現場は<b>どちらを選んでもOK</b>です。" : "現場は<b>今日はたらいた現場</b>を選んでください（れんしゅうの現場名は見本です）。"),
      help: ["下にメニューが出ていないときは、トーク画面の左下「≡」または「メニュー」を押すと出ます。",
             "途中で分からなくなったら「✖ キャンセル」を押せば最初に戻れます。何度やり直しても大丈夫です。",
             "「今日の日報はすでに登録されています」と出たら、もう出せています。そのまま次へ。",
             "LINEのプロフィール画面が開いたら「トーク」を押してください。"] },

    { kicker: "ステップ 5 / 5", title: "出した日報を確認する",
      lead: "いま出した日報がちゃんと入ったか、<b>1タップ</b>で見られます。",
      sim: [{ ctl: "menu", me: "日報確認", bot: "📋 今日の日報\n" + SITE + "：終日\n\n今月の累計も、この下に続けて出ます。" }],
      go: { label: "LINEを開いて「日報確認」を押す", sub: "下のメニューの真ん中上です", url: ADD_URL },
      ok: "<b>さっき選んだ現場と「終日」</b>が出ていればOKです。",
      help: ["まちがえて出したときは、メニューの「日報修正」から直せます。",
             "表示のしかたは実物と少しちがうことがあります（中身が合っていれば大丈夫です）。"] },
  ];
}

function renderBar(n, total) {
  document.getElementById("bar").innerHTML =
    Array.from({ length: total }, (_, i) => `<i class="${i < n ? "done" : i === n ? "now" : ""}"></i>`).join("");
  document.getElementById("who").textContent = S.name ? full() + " さん" : "";
}
function go(step) { S.step = step; S.sim = 0; save(); render(); window.scrollTo(0, 0); }
const ready = () => !!(S.name && S.code);

function render() {
  const total = 5;
  if (MAKE) { document.getElementById("bar").innerHTML = ""; return renderMake(); }
  if (S.step === 0 || !ready()) { renderBar(-1, total); return renderIntro(); }
  if (S.step > total) { renderBar(total, total); return renderFinish(); }
  renderBar(S.step - 1, total);
  renderStep(steps()[S.step - 1]);
}

function renderIntro() {
  let form;
  if (IS_DEMO) {
    form = fixedName ? `<p class="lead">あなたのデモ用の名前は <b>「デモ ${fixedName}」</b> です。</p>` :
      `<div class="card"><div class="label">案内された名前を選んでください</div>
        <div class="pick">${DEMO.names.map((n) => `<button class="${S.name === n ? "on" : ""}" data-name="${n}">${n}</button>`).join("")}</div>
        <div class="hint">分からないときは、案内した担当者に聞いてください</div></div>`;
  } else {
    form = `<div class="card">
        ${urlCode ? "" : `<label class="flabel" for="f-code">会社の合言葉（紙や案内に書いてあります）</label>
        <input class="field" id="f-code" value="${esc(S.code)}" autocomplete="off" />`}
        <label class="flabel" for="f-name" style="${urlCode ? "margin-top:0" : ""}">あなたのお名前</label>
        <input class="field" id="f-name" value="${esc(S.name)}" placeholder="例：〇〇 太郎" autocomplete="name" />
        <div class="hint" style="text-align:left">会社に登録されている名前です。名字だけでも探せます。<br>このスマホの中だけに保存され、あとでLINEに送るときに使います。</div>
      </div>`;
  }
  view.innerHTML = `
    <div class="kicker">約5分 ・ 文字はほとんど打ちません</div>
    <h2>ボタンを押していくだけで、${IS_DEMO ? "最初の日報まで進めます" : "登録と最初の日報まで進めます"}</h2>
    <p class="lead">${IS_DEMO ? `本物のFIELDLOGを、架空の会社「${DEMO.company}」のメンバーとして体験します。`
                              : `${S.company ? esc(S.company) + " の皆さまへ。" : ""}LINEで毎日の日報を出すための、最初の1回だけの設定です。`}</p>
    ${form}
    <div class="card"><ul class="plain">
      <li>① 友だち追加 → ② 合言葉 → ③ 名前（ここまで約1分）</li>
      <li>④ 日報を1件出す → ⑤ 確認する</li>
      ${IS_DEMO ? "<li>会社名・現場名・金額は<b>すべて架空</b>です</li>" : "<li>各ステップで、先に<b>れんしゅう</b>ができます</li>"}
      <li>途中で閉じても、<b>続きから</b>再開できます</li>
    </ul></div>
    <div class="card"><div class="label">📱 LINEとこのページを、行ったり来たりします</div><ul class="plain">
      <li>① このページの<b>緑のボタン</b>を押すと、LINEが開きます</li>
      <li>② LINEで操作が終わったら、このページに戻ります</li>
      <li><b>戻り方</b>：送られてきた<b>このページのリンクを、もう一度押してください</b>（続きの画面から開きます）</li>
    </ul></div>
    <button class="done" id="start">はじめる ▶</button>`;
  const btn = document.getElementById("start");
  const sync = () => {
    const c = document.getElementById("f-code"), n = document.getElementById("f-name");
    if (c) S.code = c.value.trim();
    if (n) S.name = n.value.trim().replace(/\s+/g, " ");
    btn.disabled = !ready(); btn.style.opacity = ready() ? 1 : .4;
  };
  view.querySelectorAll("[data-name]").forEach((b) => b.onclick = () => { S.name = b.dataset.name; save(); render(); });
  view.querySelectorAll(".field").forEach((f) => f.oninput = sync);
  sync();
  btn.onclick = () => { sync(); if (ready()) go(1); };
}

/* れんしゅう画面：beats[k] が「次の一手」。ctl=add/send/menu は下部の操作、ctl=pick は直前の返事に付いた選択肢を押す */
function simHtml(st) {
  const beats = st.sim, k = S.sim, next = beats[k];
  const opt = (cls, x, live, hl) => `<button class="${cls}${live && x === hl ? " hl" : live ? " dim" : ""}" ${live && x === hl ? 'data-tap="1"' : ""}>${esc(x)}</button>`;
  let talk = "", control = "";
  beats.forEach((b, i) => {
    if (i >= k) return;
    if (b.ctl !== "add") talk += bub("me", b.me);
    if (b.bot) talk += bub("bot", b.bot);
    const live = i + 1 === k && !!next && next.ctl === "pick", hl = live ? next.me : null;
    if (b.card) talk += `<div class="fcard"><div class="t">${esc(b.card.t)}</div><div class="fchips">${b.card.chips.map((x) => opt("fchip", x, live, hl)).join("")}</div><div class="fchips" style="margin-top:6px"><span class="fchip gray">✖ キャンセル</span></div></div>`;
    if (b.chips && live) talk += `<div class="chips">${b.chips.map((x) => opt("chip", x, true, hl)).join("")}</div>`;
  });
  if (next) {
    if (next.ctl === "add")  control = `<div class="addbar"><div class="nm">FIELDLOG</div><button class="hl" data-tap="1">追加</button></div>`;
    if (next.ctl === "send") control = `<div class="inputbar"><div class="box">${esc(next.me)}</div><button class="send hl" data-tap="1">送信 ▶</button></div>`;
    if (next.ctl === "menu") control = menuHtml(next.me);
  }
  if (!talk) talk = `<div class="hint" style="color:#fff;padding-top:36px">↓ 黄色く光っているところを押してください</div>`;
  return `<div class="phone"><div class="talk">${talk}</div>${control}</div>` +
    (next ? "" : `<div class="simdone">✓ れんしゅう完了。本番のLINEでも、同じ流れで返事が来ます。</div>
             <div style="text-align:center"><button class="linkbtn" id="again">もう一度れんしゅうする</button></div>`);
}

function renderStep(st) {
  view.innerHTML = `
    <div class="kicker">${st.kicker}</div>
    <h2>${esc(st.title)}</h2>
    <p class="lead">${st.lead}</p>
    <div class="card"><div class="label"><b>1</b> れんしゅう（このページの中だけ・何も送られません）</div>${simHtml(st)}</div>
    <div class="card"><div class="label"><b>2</b> 本番</div>
      <a class="go" href="${esc(st.go.url)}" id="golink">${esc(st.go.label)}<small>${esc(st.go.sub)}</small></a>
      <div class="okline">${st.ok}</div>
      <div class="okline">終わったら、このページに戻ってきてください。<br><b>戻り方</b>：送られてきたこのページのリンクを、もう一度押す（続きから開きます）</div>
    </div>
    <button class="done" id="next">できた ✓ 次へ進む</button>
    <details><summary>うまくいかないとき</summary><ul>${st.help.map((h) => `<li>${esc(h)}</li>`).join("")}</ul></details>
    <button class="back" id="prev">◀ 前のステップに戻る</button>`;
  view.querySelectorAll("[data-tap]").forEach((el) => el.onclick = () => {
    S.sim++;
    renderStep(st);
    const talk = view.querySelector(".talk"); if (talk && talk.lastElementChild) talk.lastElementChild.scrollIntoView({ block: "nearest", behavior: "smooth" });
  });
  const again = document.getElementById("again"); if (again) again.onclick = () => { S.sim = 0; renderStep(st); };
  document.getElementById("next").onclick = () => go(S.step + 1);
  document.getElementById("prev").onclick = () => go(S.step - 1);
}

function renderFinish() {
  const more = `<div class="card"><div class="label">ほかにも押してみてください（LINEの下のメニュー）</div><ul class="plain">
      <li><b>休み報告</b> … 1タップで休みを登録</li>
      <li><b>日報修正</b> … 出した日報を直す</li>
      <li><b>現場メモ</b> … 現場ごとの注意・写真の共有</li>
      <li><b>✖ キャンセル</b> … どの画面からでも最初に戻る</li>
    </ul></div>`;
  const link = (href, icn, t, d) => `<a href="${href}"><div class="icn">${icn}</div><div><div class="t">${t}</div><div class="d">${d}</div></div></a>`;
  view.innerHTML = IS_DEMO ? `
    <div class="kicker">おつかれさまでした 🎉</div>
    <h2>これで、作業員さんが毎日やる操作は全部です</h2>
    <p class="lead">日報は1回1分。会社側には、誰が・どの現場に・何人工入ったかが自動でまとまります。</p>
    ${more}
    <div class="label" style="margin:16px 2px 8px">つぎに見るもの（会社側の画面）</div>
    <div class="next-links">
      ${link("./demo.html", "🧾", "請求書とダッシュボードを触る", "日報の人工がそのまま請求書と売上になる流れ（登録不要・約3分）")}
      ${link("./manual-walkthrough.html", "▶️", "かんたん操作ツアー", "動く紙芝居で全体をおさらい")}
      ${link("./manual.html", "📱", "使い方ガイド", "困ったときの一覧")}
    </div>
    <div class="card" style="font-size:13px">体験が終わったら、案内した担当者に<b>「終わりました」</b>と一言お知らせください（LINEのブロックや削除は不要です）。</div>
    <button class="done light" id="redo">最初からもう一度見る</button>` : `
    <div class="kicker">登録できました 🎉</div>
    <h2>明日からは「日報報告」を押すだけです</h2>
    <p class="lead">仕事のあとに、LINEの下のメニューから1回1分。このページはもう開かなくて大丈夫です。</p>
    ${more}
    <div class="label" style="margin:16px 2px 8px">困ったときに見るもの</div>
    <div class="next-links">
      ${link("./manual.html", "📱", "使い方ガイド", "やり方を忘れたとき・まちがえたとき")}
      ${link("./manual-walkthrough.html", "▶️", "かんたん操作ツアー", "動く紙芝居でおさらい")}
    </div>
    <button class="done light" id="redo">最初からもう一度見る</button>`;
  document.getElementById("redo").onclick = () => go(0);
}

/* 運営用：会社ごとの案内リンクを作る（start.html?make） */
function renderMake() {
  document.getElementById("who").textContent = "運営用";
  view.innerHTML = `
    <div class="kicker">運営用 ・ このページは送らない</div>
    <h2>案内リンクを作る</h2>
    <p class="lead">会社の合言葉を入れると、作業員さんに送るリンクと文面ができます。</p>
    <div class="card">
      <label class="flabel" for="m-code" style="margin-top:0">合言葉（companies.join_code と同じ文字）</label>
      <input class="field" id="m-code" autocomplete="off" />
      <label class="flabel" for="m-co">会社名（任意・画面に表示されます）</label>
      <input class="field" id="m-co" autocomplete="off" />
    </div>
    <div class="card"><div class="label">本番用リンク</div><div class="out" id="o-url">合言葉を入れてください</div>
      <button class="copy" data-copy="o-url">リンクをコピー</button></div>
    <div class="card"><div class="label">作業員グループに送る文面</div><div class="out" id="o-msg"></div>
      <button class="copy" data-copy="o-msg">文面をコピー</button></div>
    <div class="card"><div class="label">体験用リンク（デモ建設・見学者枠）</div>
      <div class="out">${DEMO.names.map((n, i) => n + "： " + BASE + "?demo=1&n=" + (i + 1)).join("\n")}</div></div>`;
  const upd = () => {
    const c = document.getElementById("m-code").value.trim(), co = document.getElementById("m-co").value.trim();
    const url = c ? BASE + "?c=" + encodeURIComponent(c) + (co ? "&co=" + encodeURIComponent(co) : "") : "";
    document.getElementById("o-url").textContent = url || "合言葉を入れてください";
    document.getElementById("o-msg").textContent = url ? "【FIELDLOG のはじめ方（1人5分）】\nスマホで下のリンクを開いて、上から順にボタンを押していってください。\n友だち追加・登録・最初の日報まで、画面の案内どおりに進めます。\n" + url + "\n\n合言葉は「" + c + "」です（リンクから進めば入力済みです）。\n分からないときは、そのままにせず連絡してください。" : "";
  };
  view.querySelectorAll(".field").forEach((f) => f.oninput = upd);
  view.querySelectorAll("[data-copy]").forEach((b) => b.onclick = async () => {
    const t = document.getElementById(b.dataset.copy).textContent;
    try { await navigator.clipboard.writeText(t); b.textContent = "コピーしました ✓"; }
    catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById(b.dataset.copy)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "選択しました（長押しでコピー）"; }
  });
}

render();
</script>
