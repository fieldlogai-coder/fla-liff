<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>設定・確認</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="stylesheet" href="./fla-tokens.css?v=2026-07-17" />
  <style>
    /* デザイントークンは fla-tokens.css（正本）。日報面アクセントに上書き（⑥v2） */
    :root { --acc: var(--acc-daily); --acc-dark: var(--acc-daily-dark); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── ヘッダー ── */
    header {
      background: var(--acc);
      color: #fff;
      padding: 14px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      height: 48px;
      display: flex;
      align-items: center;
    }
    header h1 { font-size: 17px; }

    /* ── タブ ── */
    #tab-bar {
      display: flex;
      background: #fff;
      border-bottom: 2px solid var(--line);
      position: sticky;
      top: 48px;
      z-index: 99;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .tab {
      flex: 1;
      min-width: 70px;
      padding: 12px 6px;
      border: none;
      background: none;
      font-size: 13px;
      color: var(--sub);
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      transition: color .15s;
      font-family: inherit;
    }
    .tab.active { color: var(--acc); font-weight: bold; }
    .tab.active::after {
      content: "";
      position: absolute;
      left: 20%;
      right: 20%;
      bottom: 0;
      height: 4px;
      border-radius: 99px 99px 0 0;
      background: var(--acc);
    }

    /* ── ローディング ── */
    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 60vh;
      font-size: 15px;
      color: var(--sub);
    }
    #loading.hidden { display: none; }

    /* ── セクション ── */
    .section { display: none; padding: 16px; padding-bottom: 80px; }
    .section.active { display: block; }

    /* ── カード共通 ── */
    .card {
      background: #fff;
      border-radius: var(--r);
      padding: 14px 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      margin-bottom: 10px;
    }
    .card-title { font-size: 15px; font-weight: bold; }
    .card-sub { font-size: 12px; color: var(--sub); margin-top: 4px; }
    .card-actions { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }

    /* ── プロフィール ── */
    .info-label { font-size: 12px; color: var(--sub); margin-top: 10px; }
    .info-label:first-child { margin-top: 0; }
    .info-value { font-size: 15px; font-weight: bold; margin-top: 2px; }

    /* ── 報告履歴 ── */
    .section-label {
      font-size: 13px;
      font-weight: bold;
      color: #555;
      margin: 16px 0 8px;
    }
    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    .history-row:last-child { border-bottom: none; }
    .history-date { color: var(--sub); font-size: 12px; width: 48px; flex-shrink: 0; }
    .history-site { flex: 1; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .badge {
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 999px;
      background: var(--ok-bg);
      color: var(--ok-ink);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge.half { background: #fff8e1; color: #f39c12; }

    /* ── 追加ボタン ── */
    .add-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 14px;
      background: var(--acc);
      color: #fff;
      border: none;
      border-radius: var(--r);
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
      font-family: inherit;
      box-shadow: 0 3px 10px rgba(0,185,0,.22);
    }
    .add-btn:active { background: var(--acc-dark); }

    /* ── ロールバッジ ── */
    .role-badge {
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 999px;
      background: #e3f2fd;
      color: #1976d2;
      flex-shrink: 0;
    }
    .role-admin { background: #fce4ec; color: #c62828; }
    .cost-line { font-size: 12.5px; color: #555; margin-top: 6px; }
    .role-foreman { background: #fff3e0; color: #e65100; }

    /* ── 操作ボタン (小) ── */
    .btn-sm {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: var(--r-sm);
      border: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
      color: #555;
      font-family: inherit;
    }
    .btn-sm:active { background: var(--bg); }
    .btn-sm.danger { border-color: var(--warn); color: var(--warn); }
    .btn-sm.primary { border-color: var(--acc); color: var(--acc); }

    /* ── 単価 ── */
    .price-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .price-row:last-child { border-bottom: none; }
    .price-label { flex: 1; font-size: 14px; }
    .price-value { font-size: 16px; font-weight: bold; min-width: 80px; text-align: right; }

    /* ── プレースホルダーセクション ── */
    .placeholder-section {
      text-align: center;
      padding: 20px;
      background: #fff;
      border-radius: var(--r);
      color: #bbb;
      font-size: 13px;
      margin-top: 8px;
      border: 2px dashed var(--line);
    }

    /* ── モーダル（ボトムシート） ── */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    #modal.open { display: flex; }
    .modal-box {
      background: #fff;
      border-radius: 16px 16px 0 0;
      padding: 24px 20px 32px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 16px; font-weight: bold; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { font-size: 13px; color: #555; display: block; margin-bottom: 6px; }
    .form-group input, .form-group select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      padding: 10px 12px;
      font-size: 15px;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--acc); }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
    .modal-actions button {
      flex: 1;
      padding: 13px;
      border-radius: var(--r);
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-cancel { background: #f0eee6; color: #555; }
    .btn-submit { background: var(--acc); color: #fff; }
    .btn-submit:disabled { background: #b2dfb2; cursor: not-allowed; }
    .btn-warning { background: var(--warn); color: #fff; }
    .modal-msg { font-size: 14px; line-height: 1.6; }
    .modal-msg strong { color: var(--ink); }
    .modal-note { font-size: 12px; color: var(--sub); margin-top: 6px; }

    /* ── トースト ── */
    #toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 300;
    }
    #toast.show { opacity: 1; }
    #toast.err { background: var(--warn); }

    .empty { text-align: center; color: #aaa; padding: 30px 0; font-size: 14px; }
  </style>
</head>
<body>

<header><h1>設定・確認</h1></header>

<nav id="tab-bar">
  <button class="tab active" onclick="showTab('info')">自分の情報</button>
  <button class="tab" onclick="showTab('sites')">現場</button>
  <button class="tab" onclick="showTab('workers')">作業員</button>
  <button class="tab" id="tab-pricing" style="display:none" onclick="showTab('pricing')">単価</button>
</nav>

<div id="loading">読み込み中…</div>

<!-- セクション1: 自分の情報 -->
<div id="section-info" class="section">
  <div class="card" id="profile-card"></div>
  <div class="section-label">直近10件の報告履歴</div>
  <div class="card" id="history-card"><div class="empty">読み込み中…</div></div>
</div>

<!-- セクション2: 現場 -->
<div id="section-sites" class="section">
  <div id="sites-list"></div>
  <button class="add-btn" id="add-site-btn" style="display:none" onclick="openAddSite()">＋ 現場を追加</button>
  <div class="empty" id="add-site-note" style="display:none;border:none;padding:6px 0">現場の追加・変更は管理者（または請求担当）が行います。</div>
</div>

<!-- セクション3: 作業員 -->
<div id="section-workers" class="section">
  <div id="workers-list"></div>
  <button class="add-btn" id="add-worker-btn" style="display:none" onclick="openAddWorker()">＋ 作業員を追加</button>
</div>

<!-- セクション4: 単価 (admin only) -->
<div id="section-pricing" class="section">
  <div class="card" id="pricing-card"><div class="empty">読み込み中…</div></div>
  <div class="placeholder-section">将来追加予定：残業手当・夜勤手当の設定</div>
</div>

<!-- モーダル（ボトムシート） -->
<div id="modal" onclick="onModalBg(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<div id="toast"></div>

<script src="./fla-core.js?v=2026-10-30"></script>
<script src="./fla-support.js?v=2026-10-30"></script>
<script>
// ── 定数 ─────────────────────────────────────────────────────────────
const LIFF_ID      = "2009694631-cnI1l3gj";
// 共通基盤（fla-core.js）から取得。SUPA_URL/SUPA_ANON/AUTH_FN は FLA に集約
const SUPA_URL     = FLA.SUPA_URL;
const SUPA_ANON    = FLA.SUPA_ANON;
const AUTH_FN      = FLA.AUTH_FN;

// ── 状態 ─────────────────────────────────────────────────────────────
// 認証トークン状態は共通基盤（fla-core.js）が保持する
let cu = null;           // currentUser: { lineId, workerId, name, role, companyId, companyName }
let allSites = [];       // Site[]
let allWorkers = [];     // Worker[]
let workerCosts = null;  // { worker_id: 日給 }。null＝日給欄を出さない（管理者以外・表が無い）

// modal用
let modalMode  = "";
let pSiteName  = "";     // pending site name (類似確認待ち)
let pBilling   = "";     // pending billing name
let pSiteId    = null;   // pending site id (終了・編集用)
let pWorkerId  = null;   // pending worker id (編集用)

// ── 初期化 ───────────────────────────────────────────────────────────
(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const profile = await liff.getProfile();
    cu = { lineId: profile.userId };
    await FLA.ensureToken();   // 認証経路を先に確立（失敗ならここで止める）
    await boot();
  } catch (e) {
    if (e && e.code === "NOT_REGISTERED") {
      document.getElementById("loading").innerHTML = FLA.notRegisteredHtml();
    } else {
      toast("初期化失敗: " + e.message, true);
      hide();
    }
  }
})();

async function boot() {
  const res = await get(`/workers?line_user_id=eq.${enc(cu.lineId)}&select=id,name,role,company_id,can_bill,companies(name)`);
  if (!res.ok) { toast("ユーザー取得失敗", true); hide(); return; }
  const rows = await res.json();
  if (!rows.length) {
    document.getElementById("profile-card").innerHTML = '<div class="empty">登録されていません。管理者に連絡してください。</div>';
    hide(); showSec("info"); return;
  }
  const w = rows[0];
  cu = { ...cu, workerId: w.id, name: w.name, role: w.role, companyId: w.company_id, companyName: w.companies?.name ?? "", canBill: !!w.can_bill };
  if (cu.role === "admin") {
    document.getElementById("tab-pricing").style.display = "";
    document.getElementById("add-worker-btn").style.display = "";
  }
  // sites の書き込みは RLS で admin / can_bill 限定（20260717140000）。見えるのに必ず失敗するボタンを出さない
  const canEditSites = cu.role === "admin" || cu.canBill;
  document.getElementById("add-site-btn").style.display = canEditSites ? "" : "none";
  document.getElementById("add-site-note").style.display = canEditSites ? "none" : "";
  renderProfile();
  await Promise.all([loadHistory(), loadSites(), loadWorkers(), ...(cu.role === "admin" ? [loadPricing()] : [])]);
  hide(); showSec("info");
}

// ── セクション1: 自分の情報 ──────────────────────────────────────────
function renderProfile() {
  const rl = roleLabel(cu.role);
  document.getElementById("profile-card").innerHTML = `
    <div class="info-label">名前</div><div class="info-value">${esc(cu.name)}</div>
    <div class="info-label">役割</div><div class="info-value">${rl}</div>
    <div class="info-label">所属会社</div><div class="info-value">${esc(cu.companyName)}</div>
  `;
}

async function loadHistory() {
  const res = await get(`/report_details?worker_id=eq.${cu.workerId}&is_subcontractor=eq.false&select=report_date,duration,sites(name)&order=report_date.desc&limit=10`);
  const el = document.getElementById("history-card");
  if (!res.ok) {
    const errorText = await res.text().catch(() => "(no body)");
    console.error("[loadHistory] HTTP error", res.status, errorText);
    el.innerHTML = `<div class="empty">取得に失敗しました (HTTP ${res.status})</div>`;
    return;
  }
  const rows = await res.json();
  if (!rows.length) { el.innerHTML = '<div class="empty">報告履歴がありません</div>'; return; }
  el.innerHTML = rows.map(r => {
    const [, mm, dd] = r.report_date.split("-");
    const dur = r.duration === "full" ? "終日" : "半日";
    const cls = r.duration === "full" ? "" : " half";
    return `<div class="history-row">
      <span class="history-date">${+mm}/${+dd}</span>
      <span class="history-site">${esc(r.sites?.name ?? "不明")}</span>
      <span class="badge${cls}">${dur}</span>
    </div>`;
  }).join("");
}

// ── セクション2: 現場 ────────────────────────────────────────────────
async function loadSites() {
  const res = await get(`/sites?company_id=eq.${cu.companyId}&select=id,name,status,prime_contractors(name),workers!created_by(name)&order=name`);
  if (!res.ok) { document.getElementById("sites-list").innerHTML = '<div class="empty">取得に失敗しました</div>'; return; }
  allSites = await res.json();
  renderSites();
}

function renderSites() {
  const isAdmin = cu.role === "admin";
  const active = allSites.filter(s => s.status === "active");
  const el = document.getElementById("sites-list");
  if (!active.length) { el.innerHTML = '<div class="empty">現場が登録されていません</div>'; return; }
  el.innerHTML = active.map(s => {
    const prime = s.prime_contractors?.name ?? "";
    const creator = s.workers?.name ?? "";
    const sub = [prime ? `元請：${esc(prime)}` : "元請：未設定（請求メニュー「マスタ」で紐付け）", creator ? `登録者：${esc(creator)}` : ""].filter(Boolean).join("　");
    const adminBtns = isAdmin ? `
      <button class="btn-sm primary" onclick="openEditSite('${s.id}')">編集</button>
      <button class="btn-sm danger"  onclick="openEndSite('${s.id}')">終了</button>` : "";
    return `<div class="card">
      <div class="card-title">${esc(s.name)}</div>
      ${sub ? `<div class="card-sub">${sub}</div>` : ""}
      ${isAdmin ? `<div class="card-actions">${adminBtns}</div>` : ""}
    </div>`;
  }).join("");
}

function openAddSite() {
  modalMode = "add-site";
  const isAdmin = cu.role === "admin";
  setModal("現場を追加", `
    <div class="form-group"><label>現場名</label>
      <input type="text" id="mi-site-name" placeholder="〇〇現場" maxlength="50" /></div>
    <p class="modal-msg" style="font-size:12px;color:#666">元請との紐付け・請負金額は、請求メニュー「マスタ」で登録します。</p>
  `, `<button class="btn-cancel" onclick="closeModal()">キャンセル</button>
     <button class="btn-submit" onclick="submitModal()">登録</button>`);
}

function openEditSite(id) {
  const site = allSites.find(s => String(s.id) === String(id));
  if (!site) return;
  pSiteId = id;
  modalMode = "edit-site";
  setModal("現場名を編集", `
    <div class="form-group"><label>現場名</label>
      <input type="text" id="mi-site-name" value="${esc(site.name)}" maxlength="50" /></div>
  `, `<button class="btn-cancel" onclick="closeModal()">キャンセル</button>
     <button class="btn-submit" onclick="submitModal()">保存</button>`);
}

function openEndSite(id) {
  const site = allSites.find(s => String(s.id) === String(id));
  if (!site) return;
  pSiteId = id;
  modalMode = "end-site";
  setModal("現場を終了", `
    <p class="modal-msg">「<strong>${esc(site.name)}</strong>」を終了しますか？</p>
    <p class="modal-note">終了後は一覧から非表示になります</p>
  `, `<button class="btn-cancel" onclick="closeModal()">キャンセル</button>
     <button class="btn-warning" onclick="submitModal()">終了する</button>`);
}

// ── セクション3: 作業員 ──────────────────────────────────────────────
async function loadWorkers() {
  const res = await get(`/workers?company_id=eq.${cu.companyId}&select=id,name,role&order=name`);
  if (!res.ok) { document.getElementById("workers-list").innerHTML = '<div class="empty">取得に失敗しました</div>'; return; }
  allWorkers = await res.json();
  // 作業員ごとの日給：管理者だけが読める別の表（2026-10 worker_labor_costs）。表がまだ無い・読めない時は欄を出さない
  workerCosts = null;
  if (cu.role === "admin") {
    const cr = await get(`/worker_labor_costs?company_id=eq.${cu.companyId}&select=worker_id,labor_cost_per_day`);
    if (cr.ok) workerCosts = Object.fromEntries((await cr.json()).map(x => [x.worker_id, x.labor_cost_per_day]));
  }
  renderWorkers();
}

function renderWorkers() {
  const isAdmin = cu.role === "admin";
  const el = document.getElementById("workers-list");
  if (!allWorkers.length) { el.innerHTML = '<div class="empty">作業員が登録されていません</div>'; return; }
  el.innerHTML = allWorkers.map(w => {
    const rc = w.role === "admin" ? " role-admin" : w.role === "foreman" ? " role-foreman" : "";
    const costBtn = isAdmin && workerCosts ? `<button class="btn-sm" onclick="openEditCost('${w.id}')">日給</button>` : "";
    const adminBtns = (isAdmin && w.id !== cu.workerId ? `
      <button class="btn-sm" onclick="openEditWorker('${w.id}')">編集</button>
      <button class="btn-sm primary" onclick="openChangeRole('${w.id}')">役割変更</button>` : "") + costBtn;
    const cost = workerCosts ? workerCosts[w.id] : undefined;
    const costLine = isAdmin && workerCosts
      ? `<div class="cost-line">日給：${cost != null ? "¥" + Number(cost).toLocaleString() : "未設定（会社共通の原価で計算）"}</div>` : "";
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="card-title">${esc(w.name)}</span>
        <span class="role-badge${rc}">${roleLabel(w.role)}</span>
      </div>
      ${costLine}
      ${isAdmin ? `<div class="card-actions">${adminBtns}</div>` : ""}
    </div>`;
  }).join("");
}

function openAddWorker() {
  modalMode = "add-worker";
  setModal("作業員を追加", `
    <div class="form-group"><label>名前</label>
      <input type="text" id="mi-worker-name" placeholder="山田太郎" maxlength="30" /></div>
    <div class="form-group"><label>役割</label>
      <select id="mi-worker-role">
        <option value="worker">作業員</option>
        <option value="foreman">職長</option>
        <option value="admin">管理者</option>
      </select></div>
  `, `<button class="btn-cancel" onclick="closeModal()">キャンセル</button>
     <button class="btn-submit" onclick="submitModal()">追加</button>`);
}

function openEditWorker(id) {
  const w = allWorkers.find(x => String(x.id) === String(id));
  if (!w) return;
  pWorkerId = id;
  modalMode = "edit-worker";
  setModal(`${esc(w.name)} の名前を編集`, `
    <div class="form-group"><label>名前</label>
      <input type="text" id="mi-worker-name" value="${esc(w.name)}" maxlength="30" /></div>
  `, `<button class="btn-cancel" onclick="closeModal()">キャンセル</button>
     <button class="btn-submit" onclick="submitModal()">保存</button>`);
}

function openChangeRole(id) {
  const w = allWorkers.find(x => String(x.id) === String(id));
  if (!w) return;
  const role = w.role;
  pWorkerId = id;
  modalMode = "change-role";
  setModal(`${esc(w.name)} の役割変更`, `
    <div class="form-group"><label>役割</label>
      <select id="mi-worker-role">
        <option value="worker" ${role==="worker"?"selected":""}>作業員</option>
        <option value="foreman" ${role==="foreman"?"selected":""}>職長</option>
        <option value="admin" ${role==="admin"?"selected":""}>管理者</option>
      </select></div>
  `, `<button class="btn-cancel" onclick="closeModal()">キャンセル</button>
     <button class="btn-submit" onclick="submitModal()">変更</button>`);
}

function openEditCost(id) {
  const w = allWorkers.find(x => String(x.id) === String(id));
  if (!w || !workerCosts) return;
  pWorkerId = id;
  modalMode = "edit-cost";
  const cur = workerCosts[w.id];
  setModal(`${esc(w.name)} の日給`, `
    <div class="form-group"><label>日給（1日あたりの原価・円）</label>
      <input type="number" inputmode="numeric" id="mi-worker-cost" min="0" max="999999" step="1" value="${cur != null ? cur : ""}" placeholder="例）20000" /></div>
    <div class="hint" style="font-size:12px;color:#666;line-height:1.6">空にして保存すると、会社共通の原価で計算します。<br>日給は管理者と請求権限のある方だけに見え、職人さんには見えません。</div>
  `, `<button class="btn-cancel" onclick="closeModal()">キャンセル</button>
     <button class="btn-submit" onclick="submitModal()">保存</button>`);
}

// ── セクション4: 単価 ────────────────────────────────────────────────
// 常用単価は「元請 × 工種」ごと（billing_prices）＝請求LIFFのマスタで登録する。旧 companies.full_price は廃止済み
async function loadPricing() { renderPricing(); }

function renderPricing() {
  document.getElementById("pricing-card").innerHTML = `
    <div class="card-title">常用単価は元請ごとに設定します</div>
    <div class="card-sub" style="margin-top:6px;line-height:1.6">終日・半日の単価は「元請 × 工種」ごとに登録します。<br>請求メニュー →「請求を開く」→ 右上「マスタ」→「工種と常用単価」からどうぞ。</div>
    <div class="card-actions" style="margin-top:10px">
      <a class="btn-sm primary" href="https://liff.line.me/2009694631-7HvWrIGj" style="text-decoration:none;display:inline-block">請求のマスタを開く</a>
    </div>`;
}


// ── モーダル送信ディスパッチ ─────────────────────────────────────────
async function submitModal() {
  const btn = document.querySelector("#modal-actions .btn-submit, #modal-actions .btn-warning");
  if (btn) btn.disabled = true;
  try {
    if      (modalMode === "add-site")     await doAddSite();
    else if (modalMode === "edit-site")    await doEditSite();
    else if (modalMode === "end-site")     await doEndSite();
    else if (modalMode === "add-worker")   await doAddWorker();
    else if (modalMode === "edit-worker")  await doEditWorker();
    else if (modalMode === "change-role")  await doChangeRole();
    else if (modalMode === "edit-cost")    await doEditCost();
  } finally {
    if (btn) btn.disabled = false;
  }
}

// ── 現場追加 ─────────────────────────────────────────────────────────
async function doAddSite() {
  const name    = val("mi-site-name");
  const billing = "";   // 請求先欄は廃止（旧モデル）
  if (!name) { toast("現場名を入力してください", true); return; }

  const activeSiteNames = allSites.filter(s => s.status === "active").map(s => s.name);
  const sim = findSimilar(name, activeSiteNames);
  if (sim) {
    pSiteName = name; pBilling = billing;
    modalMode = "similar-confirm";
    setModal("登録済みの現場があります", `
      <p class="modal-msg">「<strong>${esc(sim)}</strong>」が登録済みです。こちらではありませんか？</p>
    `, `<button class="btn-submit" onclick="closeModal()">はい（登録しない）</button>
       <button class="btn-cancel" onclick="doNewSite()">いいえ（新規登録する）</button>`);
    return;
  }
  await insertSite(name, billing);
}

async function doNewSite() { closeModal(); await insertSite(pSiteName, pBilling); }

async function insertSite(name, _billing) {
  // 現場は常に自社（cu.companyId）配下。請求先を companies に作る旧モデルは廃止（RLS でも不可）
  const res = await post("/sites", { company_id: cu.companyId, name, status: "active", created_by: cu.workerId });
  if (!res.ok) { console.error("[insertSite]", res.status, await res.text().catch(() => "")); toast("登録に失敗しました", true); return; }
  closeModal(); toast(`「${name}」を登録しました`); await loadSites();
}

// ── 現場編集 ─────────────────────────────────────────────────────────
async function doEditSite() {
  const name = val("mi-site-name");
  if (!name) { toast("現場名を入力してください", true); return; }
  const res = await patch(`/sites?id=eq.${pSiteId}`, { name });
  if (!res.ok) { toast("更新に失敗しました", true); return; }
  closeModal(); toast("現場名を更新しました"); await loadSites();
}

// ── 現場終了 ─────────────────────────────────────────────────────────
async function doEndSite() {
  const res = await patch(`/sites?id=eq.${pSiteId}`, { status: "done" });
  if (!res.ok) { toast("終了処理に失敗しました", true); return; }
  closeModal(); toast("現場を終了しました"); await loadSites();
}

// ── 作業員追加 ────────────────────────────────────────────────────────
async function doAddWorker() {
  const name = val("mi-worker-name");
  const role = val("mi-worker-role") || "worker";
  if (!name) { toast("名前を入力してください", true); return; }
  const res = await post("/workers", { company_id: cu.companyId, name, role, line_user_id: null });
  if (!res.ok) { toast("追加に失敗しました", true); return; }
  closeModal(); toast(`${name}さんを追加しました`); await loadWorkers();
}

// ── 作業員名前編集 ────────────────────────────────────────────────────
async function doEditWorker() {
  const name = val("mi-worker-name");
  if (!name) { toast("名前を入力してください", true); return; }
  const res = await patch(`/workers?id=eq.${pWorkerId}`, { name });
  if (!res.ok) { toast("更新に失敗しました", true); return; }
  closeModal(); toast("名前を更新しました"); await loadWorkers();
}

// ── 役割変更 ─────────────────────────────────────────────────────────
async function doChangeRole() {
  const role = val("mi-worker-role") || "worker";
  const res = await patch(`/workers?id=eq.${pWorkerId}`, { role });
  if (!res.ok) { toast("変更に失敗しました", true); return; }
  closeModal(); toast("役割を変更しました"); await loadWorkers();
}

// ── 日給の保存（管理者のみ・RLSでも admin 限定）────────────────────────
async function doEditCost() {
  const raw = (document.getElementById("mi-worker-cost")?.value ?? "").trim();
  if (raw === "") {
    const r = await FLA.rest(`/worker_labor_costs?worker_id=eq.${pWorkerId}&company_id=eq.${cu.companyId}`, { method: "DELETE", headers: { "Prefer": "return=representation" } });
    if (!r.ok) { toast("保存に失敗しました", true); return; }
    closeModal(); toast("日給を未設定に戻しました"); await loadWorkers(); return;
  }
  const n = Number(raw);
  if (!Number.isInteger(n) || n < 0 || n > 999999) { toast("日給は0〜999,999の整数で入れてください", true); return; }
  const r = await FLA.rest(`/worker_labor_costs?on_conflict=worker_id`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Prefer": "resolution=merge-duplicates,return=representation" },
    body: JSON.stringify({ worker_id: pWorkerId, company_id: cu.companyId, labor_cost_per_day: n, updated_at: new Date().toISOString() }),
  });
  const rows = r.ok ? await r.json().catch(() => []) : [];
  if (!r.ok || !rows.length) { toast("保存に失敗しました", true); return; }
  closeModal(); toast("日給を保存しました"); await loadWorkers();
}

// ── タブ切り替え ─────────────────────────────────────────────────────
function showTab(tab) {
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.getAttribute("onclick") === `showTab('${tab}')`);
  });
  showSec(tab);
}

function showSec(name) {
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.getElementById(`section-${name}`).classList.add("active");
}

// ── モーダル制御 ─────────────────────────────────────────────────────
function setModal(title, body, actions) {
  document.getElementById("modal-title").innerHTML = title;
  document.getElementById("modal-body").innerHTML = body;
  document.getElementById("modal-actions").innerHTML = actions;
  document.getElementById("modal").classList.add("open");
  setTimeout(() => {
    const f = document.querySelector("#modal-body input, #modal-body select");
    if (f) { f.focus(); if (f.select) f.select(); }
  }, 120);
}
function closeModal() { document.getElementById("modal").classList.remove("open"); modalMode = ""; }
function onModalBg(e) { if (e.target === document.getElementById("modal")) closeModal(); }

// ── REST ヘルパー（共通基盤 FLA.rest の薄いラッパ。挙動は従来どおり）──
const get   = p       => FLA.rest(p);
const post  = (p, b)  => FLA.rest(p, { method: "POST",  headers: { "Content-Type": "application/json", "Prefer": "return=representation" }, body: JSON.stringify(b) });
const patch = (p, b)  => FLA.rest(p, { method: "PATCH", headers: { "Content-Type": "application/json", "Prefer": "return=minimal" }, body: JSON.stringify(b) });

// ── 類似名チェック ────────────────────────────────────────────────────
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    let prev = dp[0]; dp[0] = i;
    for (let j = 1; j <= n; j++) {
      const tmp = dp[j];
      dp[j] = a[i-1] === b[j-1] ? prev : 1 + Math.min(prev, dp[j], dp[j-1]);
      prev = tmp;
    }
  }
  return dp[n];
}
function findSimilar(name, names) {
  for (const n of names) {
    if (n.startsWith(name) || name.startsWith(n)) return n;
    if (levenshtein(name, n) <= 3) return n;
  }
  return null;
}

// ── ユーティリティ ────────────────────────────────────────────────────
function roleLabel(r) { return r === "admin" ? "管理者" : r === "foreman" ? "職長" : "作業員"; }
function val(id) { return (document.getElementById(id)?.value ?? "").trim(); }
function enc(s) { return encodeURIComponent(s); }
function esc(s) { return FLA.esc(s); }
function toast(msg, isErr = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = isErr ? "err show" : "show";
  setTimeout(() => t.classList.remove("show"), 3000);
}
function hide() { document.getElementById("loading").classList.add("hidden"); }
